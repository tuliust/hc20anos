name: Typecheck probe

on:
  pull_request:
    paths:
      - "src/**"
      - "api/**"
      - "tests/**"
      - "utils/**"
      - "vite.config.ts"
      - "playwright.config.ts"
      - "tsconfig.typecheck.json"
      - "package.json"
      - ".github/workflows/typecheck-probe.yml"

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install React 18 type packages for the probe
        run: npm install --no-save @types/react@18.3.27 @types/react-dom@18.3.7

      - name: Run TypeScript typecheck
        run: npm run typecheck
