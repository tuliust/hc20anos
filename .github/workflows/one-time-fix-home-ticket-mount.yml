name: One-time fix home ticket catalog mount

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-fix-home-ticket-mount.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Insert stable Home target
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("src/app/PublicTicketsCatalogMount.tsx")
          text = path.read_text()
          old = 'function findHomeTicketsTarget() {\n  const sections = Array.from(document.querySelectorAll<HTMLElement>("main section"));'
          new = 'function findHomeTicketsTarget() {\n  const explicitSection = document.querySelector<HTMLElement>("main [data-home-section=\\\'tickets\\\']");\n  const sections = Array.from(document.querySelectorAll<HTMLElement>("main section"));'
          if text.count(old) != 1:
              raise SystemExit(f"Expected one target resolver anchor, found {text.count(old)}")
          text = text.replace(old, new, 1)
          old_selection = 'const section = sections.find(candidate => {'
          new_selection = 'const section = explicitSection ?? sections.find(candidate => {'
          if text.count(old_selection) != 1:
              raise SystemExit(f"Expected one section selection, found {text.count(old_selection)}")
          path.write_text(text.replace(old_selection, new_selection, 1))
          PY

          changed="$(git diff --name-only)"
          if [ "$changed" != "src/app/PublicTicketsCatalogMount.tsx" ]; then
            echo "Unexpected changed files: $changed"
            exit 1
          fi
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/PublicTicketsCatalogMount.tsx
          git commit -m "fix: usar alvo estável no catálogo da Home"
          git push
