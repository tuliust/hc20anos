name: Retire legacy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retire-legacy-supabase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Retire unused functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not configured; remote function cleanup skipped."
            exit 0
          fi

          help="$(npx supabase functions delete --help)"
          yes_flag=()
          if grep -q -- '--yes' <<< "$help"; then yes_flag=(--yes); fi

          for fn in whatsapp-template-probe make-server-62fab262 server checkout-consent; do
            echo "Retiring $fn"
            npx supabase functions delete "$fn" --project-ref tjnqqsbwgjcdzcxykyif "${yes_flag[@]}"
          done
