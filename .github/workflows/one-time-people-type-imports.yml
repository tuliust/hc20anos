name: One-time people and profile type imports

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-people-type-imports.yml"
  pull_request:
    paths:
      - ".github/workflows/one-time-people-type-imports.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-people-type-imports-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace exact import blocks
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def block(lines: list[str]) -> str:
              return "\n".join(lines) + "\n"

          replacements = {
              Path("src/app/App.tsx"): (
                  block([
                      "import type {",
                      "  DbPerson, DbEvent, DbAuditLog, DbPhotoTag, DbOrder,",
                      "  DbProfileClaim, DbPhotoRemovalRequest, DbProfileClaimDispute, TicketStatus,",
                      "  DbPhotoComment, DbMemory, PhotoStats, ModerationStatus,",
                      "  DbPoll, DbPollOption, DbPollVote, LocationStat, PublicLocationRow, PublicProfileCardRow, AlumniDirectoryStatusRow, CuriosityProfileStatsRow, SchoolQuestionnaireOptionStatRow, PollStatus, TicketWithDetails, DbProfile, ProfileStatus, Gender,",
                      "  DbEventArchiveSettings, RelationshipStatus, EventPageGalleryItem, EventPageInfoItem, EventPageScheduleItem,",
                      "} from \"../lib/database.types\";",
                  ]),
                  block([
                      "import type {",
                      "  DbEvent, DbAuditLog, DbPhotoTag, DbOrder,",
                      "  DbProfileClaim, DbPhotoRemovalRequest, DbProfileClaimDispute, TicketStatus,",
                      "  DbPhotoComment, DbMemory, PhotoStats, ModerationStatus,",
                      "  DbPoll, DbPollOption, DbPollVote, PollStatus, TicketWithDetails,",
                      "  DbEventArchiveSettings, EventPageGalleryItem, EventPageInfoItem, EventPageScheduleItem,",
                      "} from \"../lib/database.types\";",
                      "import type {",
                      "  AlumniDirectoryStatusRow,",
                      "  CuriosityProfileStatsRow,",
                      "  DbPerson,",
                      "  DbProfile,",
                      "  Gender,",
                      "  LocationStat,",
                      "  ProfileStatus,",
                      "  PublicLocationRow,",
                      "  PublicProfileCardRow,",
                      "  RelationshipStatus,",
                      "  SchoolQuestionnaireOptionStatRow,",
                      "} from \"../lib/people.types\";",
                  ]),
              ),
              Path("src/lib/services.ts"): (
                  block([
                      "import type {",
                      "  DbPerson, DbPhotoTag,",
                      "  DbProfileClaim, DbProfileClaimAnswer, DbTicket,",
                      "  DbOrder, DbEvent, DbProfile, InsertOrder, UpsertProfile,",
                      "  DbAuditLog, TicketStatus,",
                      "  DbPhotoRemovalRequest, DbProfileClaimDispute,",
                      "  DbPhotoLike, DbPhotoComment, DbMemory, PhotoStats, ModerationStatus,",
                      "  DbPoll, DbPollOption, DbPollVote, PollStatus, PollResultRow, LocationStat, PublicLocationRow, PublicProfileCardRow, AlumniDirectoryStatusRow, CuriosityProfileStatsRow, SchoolQuestionnaireOptionStatRow, TicketWithDetails, Gender,",
                      "  DbEventArchiveSettings, DbEventPageContent, DbHomePageContent,",
                      "} from \"./database.types\";",
                  ]),
                  block([
                      "import type {",
                      "  DbPhotoTag,",
                      "  DbProfileClaim, DbProfileClaimAnswer, DbTicket,",
                      "  DbOrder, DbEvent, InsertOrder,",
                      "  DbAuditLog, TicketStatus,",
                      "  DbPhotoRemovalRequest, DbProfileClaimDispute,",
                      "  DbPhotoLike, DbPhotoComment, DbMemory, PhotoStats, ModerationStatus,",
                      "  DbPoll, DbPollOption, DbPollVote, PollStatus, PollResultRow, TicketWithDetails,",
                      "  DbEventArchiveSettings, DbEventPageContent, DbHomePageContent,",
                      "} from \"./database.types\";",
                      "import type {",
                      "  AlumniDirectoryStatusRow,",
                      "  CuriosityProfileStatsRow,",
                      "  DbPerson,",
                      "  DbProfile,",
                      "  Gender,",
                      "  LocationStat,",
                      "  PublicLocationRow,",
                      "  PublicProfileCardRow,",
                      "  SchoolQuestionnaireOptionStatRow,",
                      "  UpsertProfile,",
                      "} from \"./people.types\";",
                  ]),
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact import block, found {count}")
              path.write_text(text.replace(old, new, 1))
          PY

          changed="$(git diff --name-only)"
          expected=$'src/app/App.tsx\nsrc/lib/services.ts'
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected changed files:"
            echo "$changed"
            exit 1
          fi

          git diff --check

      - name: Commit migration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx src/lib/services.ts
          git commit -m "refactor: migrar tipos de pessoas e perfis"
          git push
