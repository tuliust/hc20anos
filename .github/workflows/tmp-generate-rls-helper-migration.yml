name: Temporary generate RLS helper hardening migration

on:
  push:
    branches:
      - hardening/rls-helper-exposure-20260916

permissions:
  contents: write

jobs:
  generate-migration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: hardening/rls-helper-exposure-20260916

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Discover Supabase CLI
        run: |
          npx supabase --help >/dev/null
          npx supabase migration --help >/dev/null
          npx supabase migration new --help >/dev/null
          npx supabase --version

      - name: Create migration with Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          npx supabase migration new restrict_admin_role_helpers
          migration_file="$(ls -1t supabase/migrations/*_restrict_admin_role_helpers.sql | head -n 1)"
          cat > "$migration_file" <<'SQL'
          -- Limit administrative role-check policies to authenticated requests before
          -- removing anonymous EXECUTE from the SECURITY DEFINER helper functions.
          --
          -- The role predicates remain unchanged; this only prevents PostgreSQL's
          -- PUBLIC policy target from evaluating admin/moderator/check-in helpers for
          -- unauthenticated Data API requests.
          do $$
          declare
            policy_row record;
          begin
            for policy_row in
              select distinct
                table_ns.nspname as schema_name,
                table_rel.relname as table_name,
                pol.polname as policy_name
              from pg_policy pol
              join pg_class table_rel
                on table_rel.oid = pol.polrelid
              join pg_namespace table_ns
                on table_ns.oid = table_rel.relnamespace
              join pg_depend dep
                on dep.classid = 'pg_policy'::regclass
               and dep.objid = pol.oid
              join pg_proc fn
                on fn.oid = dep.refobjid
              join pg_namespace fn_ns
                on fn_ns.oid = fn.pronamespace
              where table_ns.nspname = 'public'
                and fn_ns.nspname = 'public'
                and fn.proname in (
                  'has_admin_role',
                  'is_admin',
                  'is_admin_panel_user',
                  'is_superadmin'
                )
                and 0 = any(pol.polroles)
            loop
              execute format(
                'alter policy %I on %I.%I to authenticated',
                policy_row.policy_name,
                policy_row.schema_name,
                policy_row.table_name
              );
            end loop;
          end
          $$;

          revoke execute on function public.has_admin_role(public.admin_role, uuid) from public, anon;
          revoke execute on function public.is_admin(uuid) from public, anon;
          revoke execute on function public.is_admin_panel_user(uuid) from public, anon;
          revoke execute on function public.is_superadmin(uuid) from public, anon;

          grant execute on function public.has_admin_role(public.admin_role, uuid) to authenticated, service_role;
          grant execute on function public.is_admin(uuid) to authenticated, service_role;
          grant execute on function public.is_admin_panel_user(uuid) to authenticated, service_role;
          grant execute on function public.is_superadmin(uuid) to authenticated, service_role;

          -- Migration-time assertions keep the intended API boundary explicit.
          do $$
          declare
            public_helper_policy_count integer;
          begin
            select count(distinct pol.oid)
              into public_helper_policy_count
            from pg_policy pol
            join pg_class table_rel
              on table_rel.oid = pol.polrelid
            join pg_namespace table_ns
              on table_ns.oid = table_rel.relnamespace
            join pg_depend dep
              on dep.classid = 'pg_policy'::regclass
             and dep.objid = pol.oid
            join pg_proc fn
              on fn.oid = dep.refobjid
            join pg_namespace fn_ns
              on fn_ns.oid = fn.pronamespace
            where table_ns.nspname = 'public'
              and fn_ns.nspname = 'public'
              and fn.proname in (
                'has_admin_role',
                'is_admin',
                'is_admin_panel_user',
                'is_superadmin'
              )
              and 0 = any(pol.polroles);

            if public_helper_policy_count <> 0 then
              raise exception 'Expected zero PUBLIC RLS policies depending on admin role helpers; found %', public_helper_policy_count;
            end if;

            if has_function_privilege('anon', 'public.has_admin_role(public.admin_role,uuid)', 'EXECUTE')
               or has_function_privilege('anon', 'public.is_admin(uuid)', 'EXECUTE')
               or has_function_privilege('anon', 'public.is_admin_panel_user(uuid)', 'EXECUTE')
               or has_function_privilege('anon', 'public.is_superadmin(uuid)', 'EXECUTE') then
              raise exception 'Anonymous role still has EXECUTE on an administrative role helper';
            end if;

            if not has_function_privilege('authenticated', 'public.has_admin_role(public.admin_role,uuid)', 'EXECUTE')
               or not has_function_privilege('authenticated', 'public.is_admin(uuid)', 'EXECUTE')
               or not has_function_privilege('authenticated', 'public.is_admin_panel_user(uuid)', 'EXECUTE')
               or not has_function_privilege('authenticated', 'public.is_superadmin(uuid)', 'EXECUTE') then
              raise exception 'Authenticated role lost EXECUTE on an administrative role helper';
            end if;
          end
          $$;
          SQL
          echo "MIGRATION_FILE=$migration_file" >> "$GITHUB_ENV"

      - name: Commit generated migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MIGRATION_FILE"
          git commit -m "security: restringir helpers administrativos ao authenticated"
          git push origin HEAD:hardening/rls-helper-exposure-20260916
