name: Temporary refresh type reports

on:
  push:
    branches:
      - hardening/rls-helper-exposure-20260916

permissions:
  contents: write

jobs:
  refresh-reports:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/rls-helper-exposure-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate compatibility reports
        run: |
          npm run docs:generate-type-compatibility
          npm run docs:generate-type-consumers
          npm run audit:docs
      - name: Commit generated reports
        shell: bash
        run: |
          set -euo pipefail
          files=(
            docs/30-contratos/compatibilidade-de-tipos.generated.md
            docs/30-contratos/consumidores-dos-tipos.generated.md
          )
          changes="$(git status --porcelain --untracked-files=all -- "${files[@]}")"
          if [ -z "$changes" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "docs: atualizar auditoria dos tipos Supabase"
          git push origin HEAD:hardening/rls-helper-exposure-20260916
