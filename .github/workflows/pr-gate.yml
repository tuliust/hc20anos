name: PR gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: PR gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit reproducibility
        run: npm run audit:reproducibility

      - name: Enforce protected-main workflow policy
        run: npm run audit:protected-main

      - name: Validate migrations
        run: npm run audit:migrations

      - name: Audit documentation
        run: npm run audit:docs

      - name: Build application
        run: npm run build
