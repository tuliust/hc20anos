name: PR gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: PR gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Recharts v3 package files
        run: npm install --package-lock-only --ignore-scripts --save-exact recharts@3.10.1 react-is@18.3.1

      - name: Upload Recharts package files
        uses: actions/upload-artifact@v4
        with:
          name: recharts-package-files
          path: |
            package.json
            package-lock.json
          retention-days: 1

      - name: Enforce protected-main workflow policy
        run: npm run audit:protected-main

      - name: Run reproducible CI verification
        run: npm run ci:verify
