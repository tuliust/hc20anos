name: PR gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: PR gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Recharts v3 package files
        run: npm install --package-lock-only --ignore-scripts --save-exact recharts@3.10.1 react-is@18.3.1

      - name: Commit Recharts v3 package files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show edd472c3d4471857604aa48702ddd73aa083c83f:.github/workflows/pr-gate.yml > .github/workflows/pr-gate.yml
          git rm -f .github/workflows/recharts-lock-temp.yml
          git add package.json package-lock.json .github/workflows/pr-gate.yml
          if git diff --cached --quiet; then
            echo "No package changes to commit."
          else
            git commit -m "Upgrade Recharts to 3.10.1"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Enforce protected-main workflow policy
        run: npm run audit:protected-main

      - name: Run reproducible CI verification
        run: npm run ci:verify
