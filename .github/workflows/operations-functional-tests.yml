name: Operations functional tests

on:
  push:
    branches:
      - main
    paths:
      - "src/main.tsx"
      - "src/app/OperationsRouteGuard.tsx"
      - "src/app/OperationsPage.tsx"
      - "src/app/OperationsReportingPanel.tsx"
      - "src/app/CheckinScanner.tsx"
      - "src/lib/admin.types.ts"
      - "tests/e2e/operations-flow.spec.ts"
      - "tests/e2e/operations-fixtures.ts"
      - "tests/e2e/profile-claim-fixtures.ts"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/operations-functional-tests.yml"
  pull_request:
    paths:
      - "src/main.tsx"
      - "src/app/OperationsRouteGuard.tsx"
      - "src/app/OperationsPage.tsx"
      - "src/app/OperationsReportingPanel.tsx"
      - "src/app/CheckinScanner.tsx"
      - "src/lib/admin.types.ts"
      - "tests/e2e/operations-flow.spec.ts"
      - "tests/e2e/operations-fixtures.ts"
      - "tests/e2e/profile-claim-fixtures.ts"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/operations-functional-tests.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: operations-functional-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authorization-and-operation:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        id: build
        continue-on-error: true
        run: npm run build

      - name: Install Playwright Chromium
        id: browser
        continue-on-error: true
        run: npx playwright install --with-deps chromium

      - name: Run operations E2E
        id: operations_e2e
        if: steps.browser.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/e2e/operations-flow.spec.ts --workers=1 2>&1 | tee operations-e2e.log

      - name: Generate operations test report
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          E2E_OUTCOME: ${{ steps.operations_e2e.outcome }}
        shell: bash
        run: |
          mkdir -p docs/30-contratos
          verified_date="$(date -u +%F)"
          if [ "$BUILD_OUTCOME" = "success" ] && [ "$BROWSER_OUTCOME" = "success" ] && [ "$E2E_OUTCOME" = "success" ]; then
            interpretation="A proteção da rota e a segregação de funções foram aprovadas com fixtures isoladas. As RPCs e RLS continuam sendo a autoridade server-side."
          else
            interpretation="A execução encontrou regressão operacional. O diagnóstico abaixo deve ser resolvido antes de promover a proteção e o runbook."
          fi

          cat > docs/30-contratos/testes-operacionais.generated.md <<EOF
          ---
          status: generated
          owner: tuliust
          last_verified: ${verified_date}
          last_verified_commit: ${GITHUB_SHA}
          generation_command: GitHub Actions / Operations functional tests
          source_files:
            - playwright.config.ts
            - tests/e2e/operations-flow.spec.ts
            - tests/e2e/operations-fixtures.ts
            - tests/e2e/profile-claim-fixtures.ts
            - src/main.tsx
            - src/app/OperationsRouteGuard.tsx
            - src/app/OperationsPage.tsx
            - src/app/OperationsReportingPanel.tsx
            - src/app/CheckinScanner.tsx
            - docs/30-contratos/permissoes.md
          ---

          # Testes funcionais da operação

          > Relatório gerado pelo workflow \`Operations functional tests\`. Não editar manualmente.

          | Verificação | Comando | Resultado |
          |---|---|---|
          | Build da aplicação | \`npm run build\` | \`${BUILD_OUTCOME}\` |
          | Instalação do Chromium | \`npx playwright install --with-deps chromium\` | \`${BROWSER_OUTCOME}\` |
          | E2E de autorização e operação | \`npx playwright test tests/e2e/operations-flow.spec.ts --workers=1\` | \`${E2E_OUTCOME:-skipped}\` |

          ## Cobertura funcional

          - visitante sem sessão é redirecionado para o login;
          - somente \`superadmin\`, \`admin\` e \`checkin_staff\` entram na rota standalone;
          - \`checkin_staff\` registra e desfaz entrada, além de controlar vouchers;
          - \`checkin_staff\` não recebe a aba de reembolsos nem indicadores financeiros;
          - \`admin\` e \`superadmin\` recebem reembolsos e indicadores;
          - chamadas operacionais enviam os argumentos esperados às RPCs.

          ## Interpretação

          ${interpretation}
          EOF

          if [ -s operations-e2e.log ]; then
            {
              echo
              echo "## Diagnóstico E2E"
              echo
              echo '```text'
              tail -n 140 operations-e2e.log
              echo '```'
            } >> docs/30-contratos/testes-operacionais.generated.md
          fi

      - name: Audit documentation
        id: docs_audit
        if: always()
        continue-on-error: true
        run: npm run audit:docs

      - name: Publish operations report to main
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          report="docs/30-contratos/testes-operacionais.generated.md"
          changes="$(git status --porcelain --untracked-files=all -- "$report")"
          if [ -z "$changes" ]; then
            echo "Relatório operacional já está atualizado."
            exit 0
          fi

          echo "$changes"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$report"
          git commit -m "docs: atualizar evidência dos testes operacionais"

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push concorrente detectado; rebase antes da tentativa ${attempt}."
            git pull --rebase origin main
          done

          echo "Não foi possível publicar o relatório operacional."
          exit 1

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operations-functional-${{ github.sha }}
          path: |
            operations-e2e.log
            playwright-report/
            test-results/
            docs/30-contratos/testes-operacionais.generated.md
          if-no-files-found: warn
          retention-days: 14

      - name: Fail on operations regression
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          E2E_OUTCOME: ${{ steps.operations_e2e.outcome }}
          DOCS_AUDIT_OUTCOME: ${{ steps.docs_audit.outcome }}
        shell: bash
        run: |
          failed=0
          for result in "$BUILD_OUTCOME" "$BROWSER_OUTCOME" "$E2E_OUTCOME" "$DOCS_AUDIT_OUTCOME"; do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          exit "$failed"
