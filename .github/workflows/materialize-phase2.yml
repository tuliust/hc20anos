# One-shot workflow. It removes itself from the Phase 2 branch after syncing.
name: Sync Phase 2 with main

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/materialize-phase2.yml"

permissions:
  contents: write

concurrency:
  group: sync-phase2-with-main
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase2-content-storage
          fetch-depth: 0

      - name: Merge main into the Phase 2 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          git rm -f .github/workflows/materialize-phase2.yml
          git commit -m "chore: sincronizar fase 2 com main"
          git push origin HEAD:agent/phase2-content-storage
