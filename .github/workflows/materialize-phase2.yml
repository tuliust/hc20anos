# One-shot workflow. Remove after the Phase 2 runtime is committed.
name: Materialize Phase 2 runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/materialize-phase2.yml"

permissions:
  contents: write

concurrency:
  group: materialize-phase2-runtime
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase2-content-storage
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Phase 2 transforms
        run: |
          node scripts/apply-phase2-content-storage.mjs
          node scripts/apply-phase2-test-fixtures.mjs

      - name: Verify materialized state
        run: |
          node scripts/apply-phase2-content-storage.mjs --check
          node scripts/apply-phase2-test-fixtures.mjs --check

      - name: Commit runtime to the Phase 2 branch
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: materializar runtime da fase 2"
          git push origin HEAD:agent/phase2-content-storage
