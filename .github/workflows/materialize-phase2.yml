# One-shot workflow. Remove after the stable generated metadata is committed.
name: Stabilize Phase 2 generated metadata

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/materialize-phase2.yml"

permissions:
  contents: write

concurrency:
  group: stabilize-phase2-generated-metadata
  cancel-in-progress: true

jobs:
  stabilize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase2-content-storage
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch metadata generators
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path_based = [
              "scripts/generate-static-contracts.mjs",
              "scripts/generate-routes-contract.mjs",
              "scripts/generate-database-contracts.mjs",
              "scripts/audit-database-types.mjs",
              "scripts/generate-database-type-consumers.mjs",
          ]
          for name in path_based:
              path = Path(name)
              text = path.read_text()
              updated, commit_count = re.subn(
                  r'\["log",\s*"-1",\s*"--format=%H",\s*\.\.\.(pathArgs|paths)\]',
                  r'["log", "--no-merges", "-1", "--format=%H", ...\1]',
                  text,
              )
              updated, date_count = re.subn(
                  r'\["log",\s*"-1",\s*"--format=%cs",\s*\.\.\.(pathArgs|paths)\]',
                  r'["log", "--no-merges", "-1", "--format=%cs", ...\1]',
                  updated,
              )
              if commit_count != 1 or date_count != 1:
                  raise SystemExit(f"Metadados não reconhecidos em {name}: commit={commit_count}, date={date_count}")
              path.write_text(updated)

          rpc_path = Path("scripts/generate-consumed-rpc-contracts.mjs")
          rpc_text = rpc_path.read_text()
          rpc_text, rpc_count = re.subn(
              r'const sourceCommit = gitValue\(\["rev-parse", "HEAD"\], "unknown"\);\nconst verifiedDate = gitValue\(\["show", "-s", "--format=%cs", "HEAD"\], new Date\(\)\.toISOString\(\)\.slice\(0, 10\)\);',
              'const sourcePathArgs = ["--", ...SOURCE_ROOTS, "src/lib/rpc.types.ts", "scripts/generate-consumed-rpc-contracts.mjs"];\nconst sourceCommit = gitValue(["log", "--no-merges", "-1", "--format=%H", ...sourcePathArgs], "unknown");\nconst verifiedDate = gitValue(["log", "--no-merges", "-1", "--format=%cs", ...sourcePathArgs], new Date().toISOString().slice(0, 10));',
              rpc_text,
          )
          if rpc_count != 1:
              raise SystemExit(f"Metadados das RPCs não reconhecidos: {rpc_count}")
          rpc_path.write_text(rpc_text)

          workflow_path = Path(".github/workflows/phase1-environment-security.yml")
          workflow_text = workflow_path.read_text()
          marker = "          mkdir -p docs/30-contratos\n          cat > docs/30-contratos/fase-1-ambiente-e-seguranca.generated.md <<EOF"
          replacement = "          source_paths=(supabase/migrations supabase/tests src/lib/rpc.types.ts scripts/generate-consumed-rpc-contracts.mjs scripts/migrate-rpc-any-casts.mjs .github/workflows/phase1-environment-security.yml)\n          verified_commit=\"$(git log --no-merges -1 --format=%H -- \"${source_paths[@]}\")\"\n          verified_date=\"$(git log --no-merges -1 --format=%cs -- \"${source_paths[@]}\")\"\n          mkdir -p docs/30-contratos\n          cat > docs/30-contratos/fase-1-ambiente-e-seguranca.generated.md <<EOF"
          if workflow_text.count(marker) != 1:
              raise SystemExit("Marcador do relatório da Fase 1 não encontrado")
          workflow_text = workflow_text.replace(marker, replacement)
          if workflow_text.count("last_verified: $(date -u +%F)") != 1 or workflow_text.count("last_verified_commit: ${GITHUB_SHA}") != 1:
              raise SystemExit("Campos autorreferentes da Fase 1 não encontrados")
          workflow_text = workflow_text.replace("last_verified: $(date -u +%F)", "last_verified: ${verified_date}")
          workflow_text = workflow_text.replace("last_verified_commit: ${GITHUB_SHA}", "last_verified_commit: ${verified_commit}")
          workflow_path.write_text(workflow_text)
          PY

      - name: Commit stable generator sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate-static-contracts.mjs \
            scripts/generate-routes-contract.mjs \
            scripts/generate-database-contracts.mjs \
            scripts/audit-database-types.mjs \
            scripts/generate-database-type-consumers.mjs \
            scripts/generate-consumed-rpc-contracts.mjs \
            .github/workflows/phase1-environment-security.yml
          git commit -m "fix: estabilizar metadados dos contratos gerados"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_DATE=$(git show -s --format=%cs HEAD)" >> "$GITHUB_ENV"

      - name: Align generated metadata with stable source commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          commit = os.environ["SOURCE_COMMIT"]
          date = os.environ["SOURCE_DATE"]
          markdown_outputs = [
              "docs/30-contratos/APIs.generated.md",
              "docs/30-contratos/edge-functions.generated.md",
              "docs/30-contratos/variaveis-de-ambiente.generated.md",
              "docs/30-contratos/codigos-de-erro.generated.md",
              "docs/30-contratos/rotas.generated.md",
              "docs/30-contratos/banco.generated.md",
              "docs/30-contratos/RPCs.generated.md",
              "docs/30-contratos/RLS.generated.md",
              "docs/30-contratos/erd.generated.mmd",
              "docs/30-contratos/compatibilidade-de-tipos.generated.md",
              "docs/30-contratos/consumidores-dos-tipos.generated.md",
              "docs/30-contratos/RPCs-consumidas.generated.md",
              "docs/30-contratos/fase-1-ambiente-e-seguranca.generated.md",
          ]
          for name in markdown_outputs:
              path = Path(name)
              text = path.read_text()
              text, date_count = re.subn(r"^last_verified: .+$", f"last_verified: {date}", text, count=1, flags=re.M)
              text, commit_count = re.subn(r"^last_verified_commit: .+$", f"last_verified_commit: {commit}", text, count=1, flags=re.M)
              if date_count != 1 or commit_count != 1:
                  raise SystemExit(f"Front matter não reconhecido em {name}")
              path.write_text(text)

          type_outputs = [
              "docs/30-contratos/database.types.generated.ts",
              "src/lib/database.generated.ts",
              "src/lib/rpc.generated.ts",
          ]
          for name in type_outputs:
              path = Path(name)
              text = path.read_text()
              text, count = re.subn(r"^// Source commit: .+$", f"// Source commit: {commit}", text, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f"Comentário de origem não reconhecido em {name}")
              path.write_text(text)
          PY

      - name: Validate repository after metadata stabilization
        run: |
          npm ci
          node --check scripts/generate-static-contracts.mjs
          node --check scripts/generate-routes-contract.mjs
          node --check scripts/generate-database-contracts.mjs
          node --check scripts/audit-database-types.mjs
          node --check scripts/generate-database-type-consumers.mjs
          node --check scripts/generate-consumed-rpc-contracts.mjs
          npm run build
          npm run audit:docs

      - name: Commit and push stable outputs
        shell: bash
        run: |
          set -euo pipefail
          git add docs/30-contratos \
            src/lib/database.generated.ts \
            src/lib/rpc.generated.ts
          git commit -m "docs: publicar contratos com metadados estáveis"
          git push origin HEAD:agent/phase2-content-storage
