# Generated baselines are versioned by the workflow bot after validation on main.
name: Static contract generation

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "supabase/functions/**"
      - "src/**"
      - "build/**"
      - "vite.config.ts"
      - "vercel.json"
      - "scripts/generate-static-contracts.mjs"
      - "scripts/generate-routes-contract.mjs"
      - "scripts/audit-docs.mjs"
      - "docs/30-contratos/README.md"
      - "docs/30-contratos/geracao-estatica.md"
      - "package.json"
      - ".github/workflows/static-contracts.yml"
  pull_request:
    paths:
      - "api/**"
      - "supabase/functions/**"
      - "src/**"
      - "build/**"
      - "vite.config.ts"
      - "vercel.json"
      - "scripts/generate-static-contracts.mjs"
      - "scripts/generate-routes-contract.mjs"
      - "scripts/audit-docs.mjs"
      - "docs/30-contratos/README.md"
      - "docs/30-contratos/geracao-estatica.md"
      - "package.json"
      - ".github/workflows/static-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-static-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Generate static contracts
        run: npm run docs:generate-contracts

      - name: Generate route contract
        run: npm run docs:generate-routes

      - name: Audit generated documentation
        run: npm run audit:docs

      - name: Require updated contracts in pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          files=(
            docs/30-contratos/APIs.generated.md
            docs/30-contratos/edge-functions.generated.md
            docs/30-contratos/variaveis-de-ambiente.generated.md
            docs/30-contratos/codigos-de-erro.generated.md
            docs/30-contratos/rotas.generated.md
          )
          changes="$(git status --porcelain --untracked-files=all -- "${files[@]}")"
          if [ -n "$changes" ]; then
            echo "Contratos estáticos ou de rotas desatualizados:"
            echo "$changes"
            git diff -- "${files[@]}" || true
            exit 1
          fi

      - name: Upload generated contracts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-contracts-${{ github.sha }}
          path: |
            docs/30-contratos/APIs.generated.md
            docs/30-contratos/edge-functions.generated.md
            docs/30-contratos/variaveis-de-ambiente.generated.md
            docs/30-contratos/codigos-de-erro.generated.md
            docs/30-contratos/rotas.generated.md
          if-no-files-found: error
          retention-days: 14
