# Generated baselines are versioned by the workflow bot after validation on main.
name: Static contract generation

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "supabase/functions/**"
      - "src/**"
      - "build/**"
      - "scripts/generate-static-contracts.mjs"
      - "scripts/audit-docs.mjs"
      - "docs/30-contratos/README.md"
      - "docs/30-contratos/geracao-estatica.md"
      - "package.json"
      - ".github/workflows/static-contracts.yml"
  pull_request:
    paths:
      - "api/**"
      - "supabase/functions/**"
      - "src/**"
      - "build/**"
      - "scripts/generate-static-contracts.mjs"
      - "scripts/audit-docs.mjs"
      - "docs/30-contratos/README.md"
      - "docs/30-contratos/geracao-estatica.md"
      - "package.json"
      - ".github/workflows/static-contracts.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-static-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate static contracts
        run: npm run docs:generate-contracts

      - name: Audit generated documentation
        run: npm run audit:docs

      - name: Require updated contracts in pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          changes="$(git status --porcelain --untracked-files=all -- docs/30-contratos/*.generated.md)"
          if [ -n "$changes" ]; then
            echo "Contratos estáticos desatualizados ou ausentes:"
            echo "$changes"
            git diff -- docs/30-contratos/*.generated.md || true
            exit 1
          fi

      - name: Publish generated contracts to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          changes="$(git status --porcelain --untracked-files=all -- docs/30-contratos/*.generated.md)"
          if [ -z "$changes" ]; then
            echo "Contratos estáticos já estão atualizados."
            exit 0
          fi

          echo "$changes"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/30-contratos/*.generated.md
          git commit -m "docs: atualizar contratos estáticos gerados"
          git push

      - name: Upload generated contracts
        uses: actions/upload-artifact@v4
        with:
          name: static-contracts-${{ github.sha }}
          path: |
            docs/30-contratos/APIs.generated.md
            docs/30-contratos/edge-functions.generated.md
            docs/30-contratos/variaveis-de-ambiente.generated.md
            docs/30-contratos/codigos-de-erro.generated.md
          if-no-files-found: error
          retention-days: 14
