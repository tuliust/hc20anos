name: One-time commerce type imports

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-commerce-type-imports.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace exact commerce type imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("src/lib/publicTicketCatalog.ts"): (
                  'import type { DbTicketType } from "./database.types";',
                  'import type { DbTicketType } from "./commerce.types";',
              ),
              Path("src/app/SecureCheckoutPage.tsx"): (
                  'import type { DbTicketType, PaymentStatus } from "../lib/database.types";',
                  'import type { DbTicketType, PaymentStatus } from "../lib/commerce.types";',
              ),
          }

          for path, (old, new) in replacements.items():
              content = path.read_text(encoding="utf-8")
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: esperado exatamente 1 import antigo; encontrado {count}")
              path.write_text(content.replace(old, new), encoding="utf-8")
          PY

          git diff --check
          git diff -- src/lib/publicTicketCatalog.ts src/app/SecureCheckoutPage.tsx

      - name: Commit migration
        shell: bash
        run: |
          files=(src/lib/publicTicketCatalog.ts src/app/SecureCheckoutPage.tsx)
          if git diff --quiet -- "${files[@]}"; then
            echo "Nenhuma alteração encontrada."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "refactor: migrar tipos do catálogo e checkout"

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push concorrente detectado; rebase antes da tentativa ${attempt}."
            git pull --rebase origin main
          done

          echo "Não foi possível publicar a migração após três tentativas."
          exit 1
