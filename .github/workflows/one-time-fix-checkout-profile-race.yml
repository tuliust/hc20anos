name: One-time fix checkout profile race

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-fix-checkout-profile-race.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact checkout fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("src/app/SecureCheckoutPage.tsx")
          text = path.read_text()

          old_catalog = """        if (selected) {
          setProductCode(selected.product_code);
          setParticipants(defaultParticipants(selected.product_code, auth));
        }
"""
          new_catalog = """        if (selected) {
          setProductCode((currentProductCode) => {
            if (currentProductCode !== selected.product_code) {
              setParticipants(defaultParticipants(selected.product_code, auth));
            }
            return selected.product_code;
          });
        }
"""
          if text.count(old_catalog) != 1:
              raise SystemExit(f"Expected one catalog participant reset, found {text.count(old_catalog)}")
          text = text.replace(old_catalog, new_catalog, 1)

          old_buyer = """          name: current.name || name,
          email: current.email || email,
"""
          new_buyer = """          name: name || current.name,
          email: email || current.email,
"""
          if text.count(old_buyer) != 1:
              raise SystemExit(f"Expected one buyer precedence block, found {text.count(old_buyer)}")
          path.write_text(text.replace(old_buyer, new_buyer, 1))
          PY

          changed="$(git diff --name-only)"
          if [ "$changed" != "src/app/SecureCheckoutPage.tsx" ]; then
            echo "Unexpected changed files: $changed"
            exit 1
          fi
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/SecureCheckoutPage.tsx
          git commit -m "fix: preservar perfil vinculado no checkout"
          git push
