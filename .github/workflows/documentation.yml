name: Documentation safety

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/**"
      - "scripts/audit-docs.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/CODEOWNERS"
      - ".github/pull_request_template.md"
      - ".github/workflows/documentation.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Match changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/should-run-workflow.mjs documentation.yml >> "$GITHUB_OUTPUT"

  audit-documentation:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Audit documentation metadata and links
        run: npm run audit:docs
