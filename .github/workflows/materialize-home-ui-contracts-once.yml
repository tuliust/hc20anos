name: Materialize home UI contracts once

on:
  push:
    branches:
      - fix/home-ui-profile-poll-confirmed-hover
    paths:
      - .github/workflows/materialize-home-ui-contracts-once.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-ui-profile-poll-confirmed-hover
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate required contracts
        run: |
          npm run docs:generate-contracts
          npm run docs:generate-routes
          npm run docs:generate-type-consumers
      - name: Commit generated contracts
        shell: bash
        run: |
          set -euo pipefail
          files=(
            docs/30-contratos/APIs.generated.md
            docs/30-contratos/codigos-de-erro.generated.md
            docs/30-contratos/edge-functions.generated.md
            docs/30-contratos/rotas.generated.md
            docs/30-contratos/variaveis-de-ambiente.generated.md
            docs/30-contratos/consumidores-dos-tipos.generated.md
          )
          git add -- "${files[@]}"
          if git diff --cached --quiet; then
            echo "Nenhuma atualização gerada necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Atualizar contratos gerados do ajuste visual"
          git push origin HEAD:fix/home-ui-profile-poll-confirmed-hover
