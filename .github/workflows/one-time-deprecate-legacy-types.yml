name: One-time deprecate legacy database types

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-deprecate-legacy-types.yml"

permissions:
  contents: write

jobs:
  deprecate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace exact header
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("src/lib/database.types.ts")
          text = path.read_text()
          old = "\n".join([
              "// ================================================================",
              "// Tipos TypeScript gerados do schema do Supabase",
              "// Turma 2006 — Colégio Henrique Castriciano",
              "// ================================================================",
              "",
          ])
          new = "\n".join([
              "// ================================================================",
              "// DEPRECATED — mapa manual histórico, sem consumidores no runtime.",
              "// Não adicionar imports. Fonte estrutural: database.generated.ts.",
              "// Tipos funcionais: arquivos *.types.ts deste diretório.",
              "// Mantido temporariamente apenas para a auditoria comparativa.",
              "// ================================================================",
              "",
          ])
          if text.count(old) != 1:
              raise SystemExit("Cabeçalho histórico não encontrado exatamente uma vez")
          path.write_text(text.replace(old, new, 1))
          PY

          changed="$(git diff --name-only)"
          if [ "$changed" != "src/lib/database.types.ts" ]; then
            echo "Unexpected changed files: $changed"
            exit 1
          fi
          git diff --check

      - name: Commit deprecation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/database.types.ts
          git commit -m "docs: depreciar mapa manual de tipos"
          git push
