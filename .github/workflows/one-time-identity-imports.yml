name: One-time identity type imports

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-identity-imports.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace exact import blocks
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def block(lines: list[str]) -> str:
              return "\n".join(lines) + "\n"

          replacements = {
              Path("src/app/App.tsx"): (
                  block([
                      "import type {",
                      "  DbEvent, DbAuditLog, DbOrder,",
                      "  DbProfileClaim, DbProfileClaimDispute, TicketStatus,",
                      "  TicketWithDetails,",
                      "  DbEventArchiveSettings, EventPageGalleryItem, EventPageInfoItem, EventPageScheduleItem,",
                      "} from \"../lib/database.types\";",
                  ]),
                  block([
                      "import type {",
                      "  DbEvent, DbAuditLog, DbOrder,",
                      "  TicketStatus, TicketWithDetails,",
                      "  DbEventArchiveSettings, EventPageGalleryItem, EventPageInfoItem, EventPageScheduleItem,",
                      "} from \"../lib/database.types\";",
                  ]),
              ),
              Path("src/lib/services.ts"): (
                  block([
                      "import type {",
                      "  DbProfileClaim, DbProfileClaimAnswer, DbTicket,",
                      "  DbOrder, DbEvent, InsertOrder,",
                      "  DbAuditLog, TicketStatus,",
                      "  DbProfileClaimDispute,",
                      "  TicketWithDetails,",
                      "  DbEventArchiveSettings, DbEventPageContent, DbHomePageContent,",
                      "} from \"./database.types\";",
                  ]),
                  block([
                      "import type {",
                      "  DbTicket,",
                      "  DbOrder, DbEvent, InsertOrder,",
                      "  DbAuditLog, TicketStatus,",
                      "  TicketWithDetails,",
                      "  DbEventArchiveSettings, DbEventPageContent, DbHomePageContent,",
                      "} from \"./database.types\";",
                  ]),
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact import block, found {count}")
              path.write_text(text.replace(old, new, 1))

          app = Path("src/app/App.tsx")
          app_text = app.read_text()
          anchor = 'import type { DbMemory, DbPoll, DbPollOption, DbPollVote, PollStatus } from "../lib/engagement.types";\n'
          addition = (
              'import type { DbMemory, DbPoll, DbPollOption, DbPollVote, PollStatus } from "../lib/engagement.types";\n'
              'import type { DbProfileClaim, DbProfileClaimDispute } from "../lib/identity.types";\n'
          )
          if app_text.count(anchor) != 1:
              raise SystemExit("src/app/App.tsx: engagement import anchor not found exactly once")
          app.write_text(app_text.replace(anchor, addition, 1))

          services = Path("src/lib/services.ts")
          services_text = services.read_text()
          anchor = 'import type { DbMemory, DbPoll, DbPollOption, DbPollVote, PollResultRow, PollStatus } from "./engagement.types";\n'
          addition = (
              'import type { DbMemory, DbPoll, DbPollOption, DbPollVote, PollResultRow, PollStatus } from "./engagement.types";\n'
              'import type { DbProfileClaim, DbProfileClaimAnswer, DbProfileClaimDispute } from "./identity.types";\n'
          )
          if services_text.count(anchor) != 1:
              raise SystemExit("src/lib/services.ts: engagement import anchor not found exactly once")
          services.write_text(services_text.replace(anchor, addition, 1))
          PY

          changed="$(git diff --name-only)"
          expected=$'src/app/App.tsx\nsrc/lib/services.ts'
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected changed files:"
            echo "$changed"
            exit 1
          fi

          git diff --check

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx src/lib/services.ts
          git commit -m "refactor: migrar reivindicações de perfil"
          git push
