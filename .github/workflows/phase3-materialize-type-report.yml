name: Phase 3 materialize type report

on:
  push:
    branches:
      - agent/phase3-financial-execution
    paths:
      - .github/workflows/phase3-materialize-type-report.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase3-financial-execution
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate and audit reports
        run: |
          npm run docs:generate-type-compatibility
          npm run docs:generate-type-consumers
          npm run audit:docs
      - name: Commit reports
        shell: bash
        run: |
          files=(
            docs/30-contratos/compatibilidade-de-tipos.generated.md
            docs/30-contratos/consumidores-dos-tipos.generated.md
          )
          changes="$(git status --porcelain --untracked-files=all -- "${files[@]}")"
          if [ -z "${changes}" ]; then exit 0; fi
          echo "${changes}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "docs: atualizar compatibilidade de tipos da fase 3"
          git push origin HEAD:agent/phase3-financial-execution
