name: Editorial moderation functional tests

on:
  push:
    branches:
      - main
    paths:
      - "src/app/App.tsx"
      - "src/lib/services.ts"
      - "src/lib/engagement.types.ts"
      - "src/lib/photo.types.ts"
      - "tests/e2e/editorial-moderation-flow.spec.ts"
      - "tests/e2e/editorial-moderation-fixtures.ts"
      - "tests/e2e/profile-claim-fixtures.ts"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/editorial-moderation-functional-tests.yml"
  pull_request:
    paths:
      - "src/app/App.tsx"
      - "src/lib/services.ts"
      - "src/lib/engagement.types.ts"
      - "src/lib/photo.types.ts"
      - "tests/e2e/editorial-moderation-flow.spec.ts"
      - "tests/e2e/editorial-moderation-fixtures.ts"
      - "tests/e2e/profile-claim-fixtures.ts"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/editorial-moderation-functional-tests.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editorial-moderation-functional-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editorial-moderation:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        id: build
        continue-on-error: true
        run: npm run build

      - name: Install Playwright Chromium
        id: browser
        continue-on-error: true
        run: npx playwright install --with-deps chromium

      - name: Run editorial moderation E2E
        id: editorial_e2e
        if: steps.browser.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/e2e/editorial-moderation-flow.spec.ts --workers=1 2>&1 | tee editorial-moderation-e2e.log

      - name: Generate editorial moderation report
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          E2E_OUTCOME: ${{ steps.editorial_e2e.outcome }}
        shell: bash
        run: |
          mkdir -p docs/30-contratos
          verified_date="$(date -u +%F)"
          if [ "$BUILD_OUTCOME" = "success" ] && [ "$BROWSER_OUTCOME" = "success" ] && [ "$E2E_OUTCOME" = "success" ]; then
            interpretation="A execução automatizada com fixtures HTTP isoladas foi aprovada. Ela comprova autorização de interface, filas, patches e auditoria, mas não substitui RLS, grants ou revisão humana em ambiente integrado."
          else
            interpretation="A execução encontrou regressão. O diagnóstico abaixo deve ser resolvido antes de considerar a moderação editorial validada."
          fi

          cat > docs/30-contratos/testes-moderacao-editorial.generated.md <<EOF
          ---
          status: generated
          owner: tuliust
          last_verified: ${verified_date}
          last_verified_commit: ${GITHUB_SHA}
          generation_command: GitHub Actions / Editorial moderation functional tests
          source_files:
            - playwright.config.ts
            - tests/e2e/editorial-moderation-flow.spec.ts
            - tests/e2e/editorial-moderation-fixtures.ts
            - tests/e2e/profile-claim-fixtures.ts
            - src/app/App.tsx
            - src/lib/services.ts
            - src/lib/engagement.types.ts
            - src/lib/photo.types.ts
          ---

          # Testes funcionais de moderação editorial

          > Relatório gerado pelo workflow \`Editorial moderation functional tests\`. Não editar manualmente.

          | Verificação | Comando | Resultado |
          |---|---|---|
          | Build da aplicação | \`npm run build\` | \`${BUILD_OUTCOME}\` |
          | Instalação do Chromium | \`npx playwright install --with-deps chromium\` | \`${BROWSER_OUTCOME}\` |
          | E2E de moderação editorial | \`npx playwright test tests/e2e/editorial-moderation-flow.spec.ts --workers=1\` | \`${E2E_OUTCOME:-skipped}\` |

          ## Cobertura funcional

          - somente usuário administrativo entra nas filas editoriais;
          - memória anônima não revela a autoria protegida na fila;
          - aprovação de memória envia status, administrador e timestamp;
          - rejeição de comentário envia status e limpa aprovação anterior;
          - itens deixam a fila pendente depois da transição;
          - cada decisão cria registro de auditoria com entidade e identificador.

          ## Interpretação

          ${interpretation}
          EOF

          if [ -s editorial-moderation-e2e.log ]; then
            {
              echo
              echo "## Diagnóstico E2E"
              echo
              echo '```text'
              tail -n 180 editorial-moderation-e2e.log
              echo '```'
            } >> docs/30-contratos/testes-moderacao-editorial.generated.md
          fi

      - name: Audit documentation
        id: docs_audit
        if: always()
        continue-on-error: true
        run: npm run audit:docs

      - name: Publish editorial moderation report to main
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          report="docs/30-contratos/testes-moderacao-editorial.generated.md"
          changes="$(git status --porcelain --untracked-files=all -- "$report")"
          if [ -z "$changes" ]; then
            echo "Relatório editorial já está atualizado."
            exit 0
          fi

          echo "$changes"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$report"
          git commit -m "docs: atualizar evidência da moderação editorial"

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push concorrente detectado; rebase antes da tentativa ${attempt}."
            git pull --rebase origin main
          done

          echo "Não foi possível publicar o relatório editorial."
          exit 1

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-moderation-functional-${{ github.sha }}
          path: |
            editorial-moderation-e2e.log
            playwright-report/
            test-results/
            docs/30-contratos/testes-moderacao-editorial.generated.md
          if-no-files-found: warn
          retention-days: 14

      - name: Fail on editorial regression
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          E2E_OUTCOME: ${{ steps.editorial_e2e.outcome }}
          DOCS_AUDIT_OUTCOME: ${{ steps.docs_audit.outcome }}
        shell: bash
        run: |
          failed=0
          for result in "$BUILD_OUTCOME" "$BROWSER_OUTCOME" "$E2E_OUTCOME" "$DOCS_AUDIT_OUTCOME"; do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          exit "$failed"
