name: Supabase type compatibility

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "docs/30-contratos/database.types.generated.ts"
      - "scripts/audit-database-types.mjs"
      - "scripts/generate-database-type-consumers.mjs"
      - "package.json"
      - ".github/workflows/type-compatibility.yml"
  pull_request:
    paths:
      - "src/**"
      - "docs/30-contratos/database.types.generated.ts"
      - "scripts/audit-database-types.mjs"
      - "scripts/generate-database-type-consumers.mjs"
      - "package.json"
      - ".github/workflows/type-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: type-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare-types:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate compatibility report
        run: npm run docs:generate-type-compatibility

      - name: Generate consumer inventory
        run: npm run docs:generate-type-consumers

      - name: Audit generated documentation
        run: npm run audit:docs

      - name: Require updated reports in pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          files=(
            docs/30-contratos/compatibilidade-de-tipos.generated.md
            docs/30-contratos/consumidores-dos-tipos.generated.md
          )
          changes="$(git status --porcelain --untracked-files=all -- "${files[@]}")"
          if [ -n "$changes" ]; then
            echo "Relatórios de tipos desatualizados ou ausentes:"
            echo "$changes"
            git diff -- "${files[@]}" || true
            exit 1
          fi

      - name: Publish reports to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          files=(
            docs/30-contratos/compatibilidade-de-tipos.generated.md
            docs/30-contratos/consumidores-dos-tipos.generated.md
          )
          changes="$(git status --porcelain --untracked-files=all -- "${files[@]}")"
          if [ -z "$changes" ]; then
            echo "Relatórios de tipos já estão atualizados."
            exit 0
          fi

          echo "$changes"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "docs: atualizar auditoria dos tipos Supabase"

          # Outros workflows também publicam contratos gerados em main.
          # Rebasear preserva ambos os commits quando ocorrer uma corrida de push.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push concorrente detectado; atualizando main antes da tentativa ${attempt}."
            git pull --rebase origin main
          done

          echo "Não foi possível publicar os relatórios após três tentativas."
          exit 1

      - name: Upload type reports
        uses: actions/upload-artifact@v4
        with:
          name: type-compatibility-${{ github.sha }}
          path: |
            docs/30-contratos/compatibilidade-de-tipos.generated.md
            docs/30-contratos/consumidores-dos-tipos.generated.md
          if-no-files-found: error
          retention-days: 14
