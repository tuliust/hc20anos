name: Supabase type compatibility

# Mudanças de schema devem publicar os relatórios gerados antes do merge.
on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "docs/30-contratos/database.types.generated.ts"
      - "scripts/audit-database-types.mjs"
      - "scripts/generate-database-type-consumers.mjs"
      - "package.json"
      - ".github/workflows/type-compatibility.yml"
  pull_request:
    paths:
      - "src/**"
      - "docs/30-contratos/database.types.generated.ts"
      - "scripts/audit-database-types.mjs"
      - "scripts/generate-database-type-consumers.mjs"
      - "package.json"
      - ".github/workflows/type-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: type-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare-types:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate compatibility report
        run: npm run docs:generate-type-compatibility

      - name: Generate consumer inventory
        run: npm run docs:generate-type-consumers

      - name: Prevent legacy type imports
        shell: bash
        run: |
          report="docs/30-contratos/consumidores-dos-tipos.generated.md"
          if ! grep -Fq '| Arquivos consumidores | 0 |' "$report"; then
            echo "Novos imports ou augmentações de src/lib/database.types.ts foram detectados."
            sed -n '18,60p' "$report"
            exit 1
          fi

      - name: Audit generated documentation
        run: npm run audit:docs

      - name: Require updated reports in pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          files=(
            docs/30-contratos/compatibilidade-de-tipos.generated.md
            docs/30-contratos/consumidores-dos-tipos.generated.md
          )
          changes="$(git status --porcelain --untracked-files=all -- "${files[@]}")"
          if [ -n "$changes" ]; then
            echo "Relatórios de tipos desatualizados ou ausentes:"
            echo "$changes"
            git diff -- "${files[@]}" || true
            exit 1
          fi

      - name: Upload type reports
        uses: actions/upload-artifact@v4
        with:
          name: type-compatibility-${{ github.sha }}
          path: |
            docs/30-contratos/compatibilidade-de-tipos.generated.md
            docs/30-contratos/consumidores-dos-tipos.generated.md
          if-no-files-found: error
          retention-days: 14
