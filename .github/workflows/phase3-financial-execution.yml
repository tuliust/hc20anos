name: Phase 3 financial execution

on:
  push:
    branches:
      - agent/phase3-financial-execution
    paths:
      - scripts/phase3-financial-execution.mjs
      - .github/workflows/phase3-financial-execution.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: phase3-financial-execution
  cancel-in-progress: false

jobs:
  checkout-preference-idempotency:
    name: Checkout, preferência e idempotência em sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: phase3-test
    env:
      PHASE3_SUPABASE_URL: ${{ secrets.PHASE3_SUPABASE_URL }}
      PHASE3_SUPABASE_ANON_KEY: ${{ secrets.PHASE3_SUPABASE_ANON_KEY }}
      PHASE3_BUYER_EMAIL: ${{ secrets.PHASE3_BUYER_EMAIL }}
      PHASE3_BUYER_PASSWORD: ${{ secrets.PHASE3_BUYER_PASSWORD }}
      PHASE3_CHECKOUT_PAYLOAD_JSON: ${{ secrets.PHASE3_CHECKOUT_PAYLOAD_JSON }}
      PHASE3_MERCADO_PAGO_ACCESS_TOKEN: ${{ secrets.PHASE3_MERCADO_PAGO_ACCESS_TOKEN }}
      PHASE3_EXPECTED_TOTAL_CENTS: "25000"

    steps:
      - name: Guardar escopo de teste
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/agent/phase3-financial-execution" ]; then
            echo "Execução financeira bloqueada fora da branch controlada."
            exit 1
          fi
          if [ -z "${PHASE3_MERCADO_PAGO_ACCESS_TOKEN:-}" ]; then
            echo "Access token de teste ausente."
            exit 1
          fi
          echo "Escopo autorizado: criar preferência sandbox e validar idempotência."
          echo "Pagamento, webhook, ingresso, transferência e reembolso não serão executados neste job."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Execute integrated sandbox checkout
        run: node scripts/phase3-financial-execution.mjs

      - name: Publish sanitized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-checkout-idempotency-${{ github.run_id }}
          path: artifacts/phase3-checkout-idempotency.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish private checkout session
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-checkout-session-private-${{ github.run_id }}
          path: artifacts/phase3-checkout-session.private.json
          if-no-files-found: error
          retention-days: 1

      - name: Prepare Epic update
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          let report = { status: "failed", error: "relatório ausente" };
          try {
            report = JSON.parse(await readFile("artifacts/phase3-checkout-idempotency.json", "utf8"));
          } catch {}
          const ok = report.status === "passed";
          const lines = [
            `## Fase 3 — checkout integrado (${ok ? "PASS" : "FAIL"})`,
            "",
            `- Workflow run: ${process.env.GITHUB_RUN_ID}`,
            `- Commit: \`${process.env.GITHUB_SHA}\``,
            "- Ambiente: sandbox/teste",
            "- Pagamento executado: não",
            `- Etapa: ${report.stage ?? "checkout_preference_idempotency"}`,
          ];
          if (ok) {
            lines.push(
              `- Host do checkout: \`${report.checkout_host}\``,
              `- Primeira chamada reutilizou preferência: ${report.first_reused_preference}`,
              `- Segunda chamada reutilizou preferência: ${report.second_reused_preference}`,
              `- Total autoritativo: R$ ${(Number(report.order?.total_amount_cents ?? 0) / 100).toFixed(2).replace(".", ",")}`,
              `- Status financeiro: \`${report.order?.payment_status}\``,
              `- Reserva: \`${report.order?.reservation_status}\``,
              `- Participantes: ${report.order?.participant_count}`,
              "- Sessão privada de checkout disponível no artifact por 1 dia."
            );
          } else {
            lines.push(`- Erro sanitizado: \`${report.error ?? "erro desconhecido"}\``);
          }
          lines.push("", "Nenhum token, senha ou URL completa foi publicado neste comentário.");
          await writeFile("artifacts/phase3-epic-comment.md", `${lines.join("\n")}\n`, "utf8");
          NODE

      - name: Update Epic 41
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 41 --repo "${GITHUB_REPOSITORY}" --body-file artifacts/phase3-epic-comment.md

      - name: Write execution summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Fase 3 — checkout integrado"
            echo
            echo "- Ambiente: sandbox/teste"
            echo "- Pagamento executado: não"
            echo "- Relatório sanitizado: artifact phase3-checkout-idempotency-${GITHUB_RUN_ID}"
            if [ -f artifacts/phase3-checkout-session.private.json ]; then
              echo "- Sessão privada para pagamento manual: artifact phase3-checkout-session-private-${GITHUB_RUN_ID}"
              echo "- Retenção da sessão privada: 1 dia"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
