name: Phase 2 content and Storage

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/apply-phase2-content-storage.mjs"
      - "scripts/apply-phase2-test-fixtures.mjs"
      - "scripts/test-phase2-content-storage.mjs"
      - "scripts/generate-database-contracts.mjs"
      - "tests/unit/image-upload-security.test.mts"
      - "tests/e2e/phase2-content-security.spec.ts"
      - "tests/e2e/engagement-fixtures.ts"
      - "tests/e2e/photo-interactions-fixtures.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/phase2-content-storage.yml"
  pull_request:
    paths:
      - "src/**"
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/apply-phase2-content-storage.mjs"
      - "scripts/apply-phase2-test-fixtures.mjs"
      - "scripts/test-phase2-content-storage.mjs"
      - "scripts/generate-database-contracts.mjs"
      - "tests/unit/image-upload-security.test.mts"
      - "tests/e2e/phase2-content-security.spec.ts"
      - "tests/e2e/engagement-fixtures.ts"
      - "tests/e2e/photo-interactions-fixtures.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/phase2-content-storage.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase2-content-storage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stabilize-generated-metadata:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/phase2-content-storage'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase2-content-storage
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch stable source metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path_based = [
              "scripts/generate-static-contracts.mjs",
              "scripts/generate-routes-contract.mjs",
              "scripts/generate-database-contracts.mjs",
              "scripts/audit-database-types.mjs",
              "scripts/generate-database-type-consumers.mjs",
          ]
          for name in path_based:
              path = Path(name)
              text = path.read_text()
              text, commit_count = re.subn(
                  r'\["log",\s*"-1",\s*"--format=%H",\s*\.\.\.(pathArgs|paths)\]',
                  r'["log", "--no-merges", "-1", "--format=%H", ...\1]',
                  text,
              )
              text, date_count = re.subn(
                  r'\["log",\s*"-1",\s*"--format=%cs",\s*\.\.\.(pathArgs|paths)\]',
                  r'["log", "--no-merges", "-1", "--format=%cs", ...\1]',
                  text,
              )
              if commit_count != 1 or date_count != 1:
                  raise SystemExit(f"Metadados não reconhecidos em {name}: commit={commit_count}, date={date_count}")
              path.write_text(text)

          static_path = Path("scripts/generate-static-contracts.mjs")
          static_text = static_path.read_text()
          static_old = 'const SOURCE_PATHS = [...SCAN_ROOTS, "scripts/generate-static-contracts.mjs"];'
          static_new = 'const SOURCE_PATHS = [...SCAN_ROOTS, "scripts/generate-static-contracts.mjs", ":(exclude)src/lib/database.generated.ts", ":(exclude)src/lib/rpc.generated.ts"];'
          if static_text.count(static_old) != 1:
              raise SystemExit("SOURCE_PATHS estático não reconhecido")
          static_path.write_text(static_text.replace(static_old, static_new))

          audit_path = Path("scripts/audit-database-types.mjs")
          audit_text = audit_path.read_text()
          audit_old = 'const SOURCE_PATHS = [MANUAL_PATH, GENERATED_PATH, "scripts/audit-database-types.mjs"];'
          audit_new = 'const SOURCE_PATHS = [MANUAL_PATH, "supabase/migrations", "scripts/audit-database-types.mjs"];'
          if audit_text.count(audit_old) != 1:
              raise SystemExit("SOURCE_PATHS de compatibilidade não reconhecido")
          audit_path.write_text(audit_text.replace(audit_old, audit_new))

          consumers_path = Path("scripts/generate-database-type-consumers.mjs")
          consumers_text = consumers_path.read_text()
          consumers_old = 'const SOURCE_PATHS = ["src/", "scripts/generate-database-type-consumers.mjs"];'
          consumers_new = 'const SOURCE_PATHS = ["src/", "scripts/generate-database-type-consumers.mjs", ":(exclude)src/lib/database.generated.ts", ":(exclude)src/lib/rpc.generated.ts"];'
          if consumers_text.count(consumers_old) != 1:
              raise SystemExit("SOURCE_PATHS de consumidores não reconhecido")
          consumers_path.write_text(consumers_text.replace(consumers_old, consumers_new))

          rpc_path = Path("scripts/generate-consumed-rpc-contracts.mjs")
          rpc_text = rpc_path.read_text()
          rpc_text, rpc_count = re.subn(
              r'const sourceCommit = gitValue\(\["rev-parse", "HEAD"\], "unknown"\);\nconst verifiedDate = gitValue\(\["show", "-s", "--format=%cs", "HEAD"\], new Date\(\)\.toISOString\(\)\.slice\(0, 10\)\);',
              'const sourcePathArgs = ["--", ...SOURCE_ROOTS, "src/lib/rpc.types.ts", "scripts/generate-consumed-rpc-contracts.mjs", ":(exclude)src/lib/database.generated.ts", ":(exclude)src/lib/rpc.generated.ts"];\nconst sourceCommit = gitValue(["log", "--no-merges", "-1", "--format=%H", ...sourcePathArgs], "unknown");\nconst verifiedDate = gitValue(["log", "--no-merges", "-1", "--format=%cs", ...sourcePathArgs], new Date().toISOString().slice(0, 10));',
              rpc_text,
          )
          if rpc_count != 1:
              raise SystemExit(f"Metadados das RPCs não reconhecidos: {rpc_count}")
          rpc_path.write_text(rpc_text)
          PY

      - name: Commit stable generator sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate-static-contracts.mjs \
            scripts/generate-routes-contract.mjs \
            scripts/generate-database-contracts.mjs \
            scripts/audit-database-types.mjs \
            scripts/generate-database-type-consumers.mjs \
            scripts/generate-consumed-rpc-contracts.mjs
          git commit -m "fix: estabilizar origem dos contratos gerados"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_DATE=$(git show -s --format=%cs HEAD)" >> "$GITHUB_ENV"

      - name: Align generated outputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          commit = os.environ["SOURCE_COMMIT"]
          date = os.environ["SOURCE_DATE"]
          front_matter_outputs = [
              "docs/30-contratos/APIs.generated.md",
              "docs/30-contratos/edge-functions.generated.md",
              "docs/30-contratos/variaveis-de-ambiente.generated.md",
              "docs/30-contratos/codigos-de-erro.generated.md",
              "docs/30-contratos/rotas.generated.md",
              "docs/30-contratos/banco.generated.md",
              "docs/30-contratos/RPCs.generated.md",
              "docs/30-contratos/RLS.generated.md",
              "docs/30-contratos/compatibilidade-de-tipos.generated.md",
              "docs/30-contratos/consumidores-dos-tipos.generated.md",
              "docs/30-contratos/RPCs-consumidas.generated.md",
          ]
          for name in front_matter_outputs:
              path = Path(name)
              text = path.read_text()
              text, date_count = re.subn(r"^last_verified: .+$", f"last_verified: {date}", text, count=1, flags=re.M)
              text, commit_count = re.subn(r"^last_verified_commit: .+$", f"last_verified_commit: {commit}", text, count=1, flags=re.M)
              if date_count != 1 or commit_count != 1:
                  raise SystemExit(f"Front matter não reconhecido em {name}")
              path.write_text(text)

          erd_path = Path("docs/30-contratos/erd.generated.mmd")
          erd_text = erd_path.read_text()
          erd_text, date_count = re.subn(r"^%% last_verified: .+$", f"%% last_verified: {date}", erd_text, count=1, flags=re.M)
          erd_text, commit_count = re.subn(r"^%% last_verified_commit: .+$", f"%% last_verified_commit: {commit}", erd_text, count=1, flags=re.M)
          if date_count != 1 or commit_count != 1:
              raise SystemExit("Metadados Mermaid do ERD não reconhecidos")
          erd_path.write_text(erd_text)

          for name in [
              "docs/30-contratos/database.types.generated.ts",
              "src/lib/database.generated.ts",
              "src/lib/rpc.generated.ts",
          ]:
              path = Path(name)
              text = path.read_text()
              text, count = re.subn(r"^// Source commit: .+$", f"// Source commit: {commit}", text, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f"Comentário de origem não reconhecido em {name}")
              path.write_text(text)
          PY

      - name: Validate and publish stable metadata
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --check scripts/generate-static-contracts.mjs
          node --check scripts/generate-routes-contract.mjs
          node --check scripts/generate-database-contracts.mjs
          node --check scripts/audit-database-types.mjs
          node --check scripts/generate-database-type-consumers.mjs
          node --check scripts/generate-consumed-rpc-contracts.mjs
          npm run build
          npm run audit:docs
          git add docs/30-contratos src/lib/database.generated.ts src/lib/rpc.generated.ts
          git commit -m "docs: alinhar baselines aos metadados estáveis"
          git push origin HEAD:agent/phase2-content-storage

  content-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Phase 2 integration
        run: |
          node scripts/apply-phase2-content-storage.mjs
          node scripts/apply-phase2-test-fixtures.mjs

      - name: Test image byte validation
        run: npm run test:image-security

      - name: Clean and start local Supabase
        run: |
          npx supabase stop --no-backup || true
          npx supabase start

      - name: Replay all migrations
        run: npx supabase db reset --local

      - name: Install deterministic Auth users and roles
        run: docker exec -i supabase_db_hc20anos psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -P pager=off < supabase/tests/fixtures/local_test_context.sql

      - name: Run SQL suites
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r test_file; do
            echo "===== ${test_file} ====="
            output="$(docker exec -i supabase_db_hc20anos psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -P pager=off < "${test_file}" 2>&1)"
            printf '%s\n' "$output"
            if grep -Eq '(^|[^A-Z])FAIL([^A-Z]|$)' <<< "$output"; then exit 1; fi
          done < <(find supabase/tests -maxdepth 1 -type f -name '*.sql' | sort)

      - name: Regenerate database and runtime contracts
        run: |
          npm run docs:generate-db-contracts
          npm run docs:generate-rpc-usage

      - name: Build typed application
        run: npm run build

      - name: Serve photo-storage Edge Function
        shell: bash
        run: |
          printf '%s\n' 'SUPABASE_PUBLIC_URL=http://127.0.0.1:54321' > phase2-functions.env
          npx supabase functions serve photo-storage \
            --no-verify-jwt \
            --env-file phase2-functions.env \
            > phase2-edge-function.log 2>&1 &
          echo $! > phase2-edge-function.pid
          for attempt in $(seq 1 90); do
            response="$(curl -sS -X POST \
              -H 'Content-Type: application/json' \
              -d '{}' \
              -w $'\n%{http_code}' \
              'http://127.0.0.1:54321/functions/v1/photo-storage?action=upload' || true)"
            status="${response##*$'\n'}"
            body="${response%$'\n'*}"
            if [ "$status" = "401" ] && grep -q '"error":"authentication_required"' <<< "$body"; then
              exit 0
            fi
            sleep 1
          done
          cat phase2-edge-function.log
          exit 1

      - name: Run real Auth, Storage and content integration
        run: npm run test:phase2:storage

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser regressions
        run: |
          npx playwright test \
            tests/e2e/phase2-content-security.spec.ts \
            tests/e2e/engagement-flow.spec.ts \
            tests/e2e/photo-interactions-flow.spec.ts \
            tests/e2e/editorial-moderation-flow.spec.ts \
            --workers=1

      - name: Audit documentation
        run: npm run audit:docs

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-content-storage-${{ github.sha }}
          path: |
            phase2-edge-function.log
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop local services
        if: always()
        run: |
          if [ -f phase2-edge-function.pid ]; then kill "$(cat phase2-edge-function.pid)" 2>/dev/null || true; fi
          rm -f phase2-functions.env
          npx supabase stop --no-backup || true
