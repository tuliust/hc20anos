name: Phase 2 content and Storage

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/apply-phase2-content-storage.mjs"
      - "scripts/apply-phase2-test-fixtures.mjs"
      - "scripts/test-phase2-content-storage.mjs"
      - "scripts/generate-database-contracts.mjs"
      - "tests/unit/image-upload-security.test.mts"
      - "tests/e2e/phase2-content-security.spec.ts"
      - "tests/e2e/engagement-fixtures.ts"
      - "tests/e2e/photo-interactions-fixtures.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/phase2-content-storage.yml"
  pull_request:
    paths:
      - "src/**"
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/apply-phase2-content-storage.mjs"
      - "scripts/apply-phase2-test-fixtures.mjs"
      - "scripts/test-phase2-content-storage.mjs"
      - "scripts/generate-database-contracts.mjs"
      - "tests/unit/image-upload-security.test.mts"
      - "tests/e2e/phase2-content-security.spec.ts"
      - "tests/e2e/engagement-fixtures.ts"
      - "tests/e2e/photo-interactions-fixtures.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/phase2-content-storage.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase2-content-storage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize-type-reports:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase2-content-storage
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate and publish type reports
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run docs:generate-type-compatibility
          npm run docs:generate-type-consumers
          npm run audit:docs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/30-contratos/compatibilidade-de-tipos.generated.md \
            docs/30-contratos/consumidores-dos-tipos.generated.md
          git commit -m "docs: atualizar relatórios estáveis de tipos"
          git push origin HEAD:agent/phase2-content-storage

  content-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Phase 2 integration
        run: |
          node scripts/apply-phase2-content-storage.mjs
          node scripts/apply-phase2-test-fixtures.mjs

      - name: Test image byte validation
        run: npm run test:image-security

      - name: Clean and start local Supabase
        run: |
          npx supabase stop --no-backup || true
          npx supabase start

      - name: Replay all migrations
        run: npx supabase db reset --local

      - name: Install deterministic Auth users and roles
        run: docker exec -i supabase_db_hc20anos psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -P pager=off < supabase/tests/fixtures/local_test_context.sql

      - name: Run SQL suites
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r test_file; do
            echo "===== ${test_file} ====="
            output="$(docker exec -i supabase_db_hc20anos psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -P pager=off < "${test_file}" 2>&1)"
            printf '%s\n' "$output"
            if grep -Eq '(^|[^A-Z])FAIL([^A-Z]|$)' <<< "$output"; then exit 1; fi
          done < <(find supabase/tests -maxdepth 1 -type f -name '*.sql' | sort)

      - name: Regenerate database and runtime contracts
        run: |
          npm run docs:generate-db-contracts
          npm run docs:generate-rpc-usage

      - name: Build typed application
        run: npm run build

      - name: Serve photo-storage Edge Function
        shell: bash
        run: |
          printf '%s\n' 'SUPABASE_PUBLIC_URL=http://127.0.0.1:54321' > phase2-functions.env
          npx supabase functions serve photo-storage \
            --no-verify-jwt \
            --env-file phase2-functions.env \
            > phase2-edge-function.log 2>&1 &
          echo $! > phase2-edge-function.pid
          for attempt in $(seq 1 90); do
            response="$(curl -sS -X POST \
              -H 'Content-Type: application/json' \
              -d '{}' \
              -w $'\n%{http_code}' \
              'http://127.0.0.1:54321/functions/v1/photo-storage?action=upload' || true)"
            status="${response##*$'\n'}"
            body="${response%$'\n'*}"
            if [ "$status" = "401" ] && grep -q '"error":"authentication_required"' <<< "$body"; then
              exit 0
            fi
            sleep 1
          done
          cat phase2-edge-function.log
          exit 1

      - name: Run real Auth, Storage and content integration
        run: npm run test:phase2:storage

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser regressions
        run: |
          npx playwright test \
            tests/e2e/phase2-content-security.spec.ts \
            tests/e2e/engagement-flow.spec.ts \
            tests/e2e/photo-interactions-flow.spec.ts \
            tests/e2e/editorial-moderation-flow.spec.ts \
            --workers=1

      - name: Audit documentation
        run: npm run audit:docs

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-content-storage-${{ github.sha }}
          path: |
            phase2-edge-function.log
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop local services
        if: always()
        run: |
          if [ -f phase2-edge-function.pid ]; then kill "$(cat phase2-edge-function.pid)" 2>/dev/null || true; fi
          rm -f phase2-functions.env
          npx supabase stop --no-backup || true
