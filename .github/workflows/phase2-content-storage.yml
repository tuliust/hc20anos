name: Phase 2 content and Storage

on:
  pull_request:
    paths:
      - "src/**"
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/apply-phase2-content-storage.mjs"
      - "scripts/apply-phase2-test-fixtures.mjs"
      - "scripts/test-phase2-content-storage.mjs"
      - "scripts/generate-database-contracts.mjs"
      - "tests/unit/image-upload-security.test.mts"
      - "tests/e2e/phase2-content-security.spec.ts"
      - "tests/e2e/engagement-fixtures.ts"
      - "tests/e2e/photo-interactions-fixtures.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/phase2-content-storage.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase2-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  content-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Phase 2 integration
        run: |
          node scripts/apply-phase2-content-storage.mjs
          node scripts/apply-phase2-test-fixtures.mjs

      - name: Materialize Phase 2 runtime in the source branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: materializar runtime da fase 2"
          git push origin "HEAD:${HEAD_REF}"

      - name: Verify Phase 2 integration is materialized
        run: |
          node scripts/apply-phase2-content-storage.mjs --check
          node scripts/apply-phase2-test-fixtures.mjs --check

      - name: Test image byte validation
        run: npm run test:image-security

      - name: Clean and start local Supabase
        run: |
          npx supabase stop --no-backup || true
          npx supabase start

      - name: Replay all migrations
        run: npx supabase db reset --local

      - name: Install deterministic Auth users and roles
        run: docker exec -i supabase_db_hc20anos psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -P pager=off < supabase/tests/fixtures/local_test_context.sql

      - name: Run SQL suites
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r test_file; do
            echo "===== ${test_file} ====="
            output="$(docker exec -i supabase_db_hc20anos psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -P pager=off < "${test_file}" 2>&1)"
            printf '%s\n' "$output"
            if grep -Eq '(^|[^A-Z])FAIL([^A-Z]|$)' <<< "$output"; then exit 1; fi
          done < <(find supabase/tests -maxdepth 1 -type f -name '*.sql' | sort)

      - name: Regenerate database and runtime contracts
        run: |
          npm run docs:generate-db-contracts
          npm run docs:generate-rpc-usage

      - name: Build typed application
        run: npm run build

      - name: Serve photo-storage Edge Function
        shell: bash
        run: |
          npx supabase functions serve photo-storage --no-verify-jwt > phase2-edge-function.log 2>&1 &
          echo $! > phase2-edge-function.pid
          for attempt in $(seq 1 60); do
            status="$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS http://127.0.0.1:54321/functions/v1/photo-storage || true)"
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 1
          done
          cat phase2-edge-function.log
          exit 1

      - name: Run real Auth, Storage and content integration
        run: npm run test:phase2:storage

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser regressions
        run: |
          npx playwright test \
            tests/e2e/phase2-content-security.spec.ts \
            tests/e2e/engagement-flow.spec.ts \
            tests/e2e/photo-interactions-flow.spec.ts \
            tests/e2e/editorial-moderation-flow.spec.ts \
            --workers=1

      - name: Audit documentation
        run: npm run audit:docs

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-pr-${{ github.sha }}
          path: |
            phase2-edge-function.log
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop local services
        if: always()
        run: |
          if [ -f phase2-edge-function.pid ]; then kill "$(cat phase2-edge-function.pid)" 2>/dev/null || true; fi
          npx supabase stop --no-backup || true
