name: Stable release v1.0.0 verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-release-v1.0.0-verification
  cancel-in-progress: false

jobs:
  verify-release:
    if: github.repository == 'tuliust/hc20anos'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout immutable v1.0.0 tag
        uses: actions/checkout@v4
        with:
          ref: v1.0.0
          fetch-depth: 0

      - name: Verify immutable tag and published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.0" --jq '.object.sha')"
          release_target="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.0" --jq '.target_commitish')"

          test "$checked_out_sha" = "$tag_sha" || {
            echo "Checkout/tag mismatch: checkout=$checked_out_sha tag=$tag_sha"
            exit 1
          }

          test "$release_target" = "$tag_sha" || {
            echo "Release/tag mismatch: release=$release_target tag=$tag_sha"
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify release version
        shell: bash
        run: |
          test "$(node -p "require('./package.json').version")" = "1.0.0"
          test "$(node -p "require('./package-lock.json').version")" = "1.0.0"

      - name: Install frozen dependencies
        run: npm ci

      - name: Audit reproducibility
        run: npm run audit:reproducibility

      - name: Validate migrations
        run: npm run audit:migrations

      - name: Validate generated contracts
        run: |
          npm run docs:check-contracts
          npm run docs:check-routes
          npm run docs:check-type-compatibility
          npm run docs:check-type-consumers
          npm run docs:check-rpc-usage

      - name: Audit documentation
        run: npm run audit:docs

      - name: Build immutable release
        run: npm run build
