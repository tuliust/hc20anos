name: Stable release

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "docs/30-contratos/release-v1.0.0.md"
      - "docs/40-runbooks/procedimento-operacional-v1.0.0.md"
      - ".github/workflows/release-stable.yml"

permissions:
  contents: write

concurrency:
  group: stable-release-v1.0.0
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'tuliust/hc20anos'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify release version
        shell: bash
        run: |
          test "$(node -p "require('./package.json').version")" = "1.0.0"
          test "$(node -p "require('./package-lock.json').version")" = "1.0.0"

      - name: Install frozen dependencies
        run: npm ci

      - name: Audit reproducibility
        run: npm run audit:reproducibility

      - name: Validate migrations
        run: npm run audit:migrations

      - name: Validate generated contracts
        run: |
          npm run docs:check-contracts
          npm run docs:check-routes
          npm run docs:check-type-compatibility
          npm run docs:check-type-consumers
          npm run docs:check-rpc-usage

      - name: Audit documentation
        run: npm run audit:docs

      - name: Build application
        run: npm run build

      - name: Verify immutable v1.0.0 target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.0" --jq '.object.sha' 2>/dev/null)"; then
            test "$tag_sha" = "$GITHUB_SHA" || {
              echo "v1.0.0 already exists on a different commit: $tag_sha"
              exit 1
            }
          fi

      - name: Create GitHub Release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "GitHub Release v1.0.0 already exists."
          else
            gh release create v1.0.0 --title "HC 20 Anos v1.0.0" --target "$GITHUB_SHA" --notes-file docs/30-contratos/release-v1.0.0.md
          fi
