name: One-time photo type imports

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-photo-type-imports.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace exact photo type imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("src/historyContentEnhancements.ts"),
              Path("src/historyPersonFilterEnhancement.ts"),
              Path("src/historyPhotoRefreshEnhancement.ts"),
          ]
          old = 'import type { DbPhoto } from "./lib/database.types";'
          new = 'import type { DbPhoto } from "./lib/photo.types";'

          for path in paths:
              content = path.read_text(encoding="utf-8")
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: esperado exatamente 1 import antigo; encontrado {count}")
              path.write_text(content.replace(old, new), encoding="utf-8")
          PY

          git diff --check
          git diff -- src/historyContentEnhancements.ts src/historyPersonFilterEnhancement.ts src/historyPhotoRefreshEnhancement.ts

      - name: Commit migration
        shell: bash
        run: |
          files=(
            src/historyContentEnhancements.ts
            src/historyPersonFilterEnhancement.ts
            src/historyPhotoRefreshEnhancement.ts
          )
          if git diff --quiet -- "${files[@]}"; then
            echo "Nenhuma alteração encontrada."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "refactor: migrar tipo de foto nos enhancements"

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push concorrente detectado; rebase antes da tentativa ${attempt}."
            git pull --rebase origin main
          done

          echo "Não foi possível publicar a migração após três tentativas."
          exit 1
