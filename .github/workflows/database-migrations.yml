# Diagnostic validation trigger. Remove before closing this PR.
name: Database migration safety

on:
  push:
    branches:
      - main
    paths:
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "supabase/manual/**"
      - "scripts/generate-database-contracts.mjs"
      - "scripts/validate-supabase-migrations.mjs"
      - "scripts/repair-supabase-migration-history.ps1"
      - "build/profileClaimIdentityTransform.mjs"
      - "src/lib/profileClaimIdentity.ts"
      - "tests/e2e/profile-claim-*.ts"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/database-migrations.yml"
  pull_request:
    paths:
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "supabase/manual/**"
      - "scripts/generate-database-contracts.mjs"
      - "scripts/validate-supabase-migrations.mjs"
      - "scripts/repair-supabase-migration-history.ps1"
      - "build/profileClaimIdentityTransform.mjs"
      - "src/lib/profileClaimIdentity.ts"
      - "tests/e2e/profile-claim-*.ts"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/database-migrations.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: database-migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit migration filenames and destructive SQL
        run: npm run audit:migrations

      - name: Validate remote history repair script in planning mode
        shell: pwsh
        run: ./scripts/repair-supabase-migration-history.ps1

      - name: Build application
        run: npm run build

  profile-claim-e2e:
    needs: static-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test profile claim resume and admin evidence
        run: npm run test:e2e -- tests/e2e/profile-claim-flow.spec.ts

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-claim-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  migration-replay:
    needs: static-audit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase stack
        run: |
          set -o pipefail
          npx supabase start 2>&1 | tee supabase-start.log

      - name: Replay all migrations from an empty local database
        run: |
          set -o pipefail
          npx supabase db reset --local 2>&1 | tee supabase-reset.log

      - name: Show local migration history
        run: |
          set -o pipefail
          npx supabase migration list --local 2>&1 | tee supabase-migrations.log

      - name: Install local authenticated test context
        run: |
          set -o pipefail
          docker exec -i supabase_db_hc20anos \
            psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -P pager=off \
            < supabase/tests/fixtures/local_test_context.sql \
            2>&1 | tee supabase-fixture.log

      - name: Run SQL integrity tests
        shell: bash
        run: |
          set -u
          : > supabase-tests.log
          test_failed=0

          while IFS= read -r test_file; do
            echo "===== ${test_file} =====" | tee -a supabase-tests.log
            if ! output="$(docker exec -i supabase_db_hc20anos \
              psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -P pager=off \
              < "${test_file}" 2>&1)"; then
              printf '%s\n' "${output}" | tee -a supabase-tests.log
              echo "SQL execution failed: ${test_file}" | tee -a supabase-tests.log
              test_failed=1
              continue
            fi

            printf '%s\n' "${output}" | tee -a supabase-tests.log

            if grep -Eq '(^|[^A-Z])FAIL([^A-Z]|$)' <<< "${output}"; then
              echo "Test reported FAIL: ${test_file}" | tee -a supabase-tests.log
              test_failed=1
            fi
          done < <(find supabase/tests -maxdepth 1 -type f -name '*.sql' | sort)

          exit "${test_failed}"

      - name: Generate database contracts
        run: npm run docs:generate-db-contracts

      - name: Audit generated database documentation
        run: npm run audit:docs

      - name: Require updated database contracts in pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          changes="$(git status --porcelain --untracked-files=all -- \
            docs/30-contratos/banco.generated.md \
            docs/30-contratos/RPCs.generated.md \
            docs/30-contratos/RLS.generated.md \
            docs/30-contratos/erd.generated.mmd \
            docs/30-contratos/database.types.generated.ts)"
          if [ -n "$changes" ]; then
            echo "Contratos do banco desatualizados ou ausentes:"
            echo "$changes"
            git diff -- docs/30-contratos || true
            exit 1
          fi

      - name: Publish database contracts to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          changes="$(git status --porcelain --untracked-files=all -- \
            docs/30-contratos/banco.generated.md \
            docs/30-contratos/RPCs.generated.md \
            docs/30-contratos/RLS.generated.md \
            docs/30-contratos/erd.generated.mmd \
            docs/30-contratos/database.types.generated.ts)"
          if [ -z "$changes" ]; then
            echo "Contratos do banco já estão atualizados."
            exit 0
          fi

          echo "$changes"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/30-contratos/banco.generated.md \
            docs/30-contratos/RPCs.generated.md \
            docs/30-contratos/RLS.generated.md \
            docs/30-contratos/erd.generated.mmd \
            docs/30-contratos/database.types.generated.ts
          git commit -m "docs: atualizar contratos gerados do banco"
          git push

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --no-backup

      - name: Upload replay diagnostics and database contracts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-replay-and-contracts
          path: |
            supabase-start.log
            supabase-reset.log
            supabase-migrations.log
            supabase-fixture.log
            supabase-tests.log
            docs/30-contratos/banco.generated.md
            docs/30-contratos/RPCs.generated.md
            docs/30-contratos/RLS.generated.md
            docs/30-contratos/erd.generated.mmd
            docs/30-contratos/database.types.generated.ts
          if-no-files-found: warn
          retention-days: 14
