name: Stage 3 modal and drill-down E2E

on:
  pull_request:
    paths:
      - "src/app/App.tsx"
      - "src/lib/services.ts"
      - "src/lib/people.types.ts"
      - "src/lib/photo.types.ts"
      - "src/historyContentEnhancements.ts"
      - "src/historyPersonFilterEnhancement.ts"
      - "src/historyPhotoRefreshEnhancement.ts"
      - "tests/e2e/home-fixtures.ts"
      - "tests/e2e/stage3-*.spec.ts"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/stage3-modals-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage3-modals-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage3-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Stage 3 E2E
        run: npx playwright test tests/e2e/stage3-*.spec.ts --workers=1
