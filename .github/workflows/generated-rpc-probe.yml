name: Generated RPC probe
# Temporary: removed once generated outputs are committed.

on:
  pull_request:
    paths:
      - "src/**"
      - "api/**"
      - "supabase/functions/**"
      - "build/**"
      - "scripts/generate-consumed-rpc-contracts.mjs"
      - ".github/workflows/generated-rpc-probe.yml"

permissions:
  contents: write

jobs:
  generate:
    name: Generate RPC artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run docs:generate-rpc-usage
      - name: Commit generated RPC contracts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/rpc.generated.ts docs/30-contratos/RPCs-consumidas.generated.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualiza contratos RPC efetivos"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: generated-rpc-contracts
          path: |
            src/lib/rpc.generated.ts
            docs/30-contratos/RPCs-consumidas.generated.md
