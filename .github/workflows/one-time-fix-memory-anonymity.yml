name: One-time fix memory anonymity

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-fix-memory-anonymity.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact anonymity control fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          app = Path("src/app/App.tsx")
          app_text = app.read_text()
          old_button = '''              <button onClick={() => setIsAnonymous(v => !v)} className={`relative w-12 h-6 transition-colors ${isAnonymous ? "bg-[#2d6a4f]" : "bg-[#1a2e1a] border border-[#2d6a4f]/30"}`}>
                <div className={`absolute top-1 w-4 h-4 bg-[#f0ebe0] transition-all ${isAnonymous ? "left-7" : "left-1"}`} />
              </button>'''
          new_button = '''              <button
                type="button"
                role="switch"
                aria-checked={isAnonymous}
                aria-label="Enviar sem mostrar meu nome"
                onClick={() => setIsAnonymous(v => !v)}
                className={`relative w-12 h-6 transition-colors ${isAnonymous ? "bg-[#2d6a4f]" : "bg-[#1a2e1a] border border-[#2d6a4f]/30"}`}
              >
                <div aria-hidden="true" className={`absolute top-1 w-4 h-4 bg-[#f0ebe0] transition-all ${isAnonymous ? "left-7" : "left-1"}`} />
              </button>'''
          if app_text.count(old_button) != 1:
              raise SystemExit(f"Expected one memory anonymity button, found {app_text.count(old_button)}")
          app.write_text(app_text.replace(old_button, new_button, 1))

          enhancement = Path("src/historyContentEnhancements.ts")
          enhancement_text = enhancement.read_text()
          old_block = '''  const anonymousText = Array.from(formCard.querySelectorAll<HTMLElement>("span"))
    .find(element => normalizeText(element.textContent) === "enviar sem mostrar meu nome");
  const anonymousControl = anonymousText?.closest<HTMLElement>("label");
  if (anonymousControl) {
    const toggle = anonymousControl.querySelector<HTMLButtonElement>("button");
    if (toggle?.className.includes("bg-[#2d6a4f]")) toggle.click();
    if (anonymousControl.style.display !== "none") anonymousControl.style.display = "none";
  }
'''
          new_block = '''  const anonymousText = Array.from(formCard.querySelectorAll<HTMLElement>("span"))
    .find(element => normalizeText(element.textContent) === "enviar sem mostrar meu nome");
  const anonymousControl = anonymousText?.closest<HTMLElement>("label");
  if (anonymousControl) {
    anonymousControl.style.removeProperty("display");
    anonymousControl.removeAttribute("aria-hidden");
  }
'''
          if enhancement_text.count(old_block) != 1:
              raise SystemExit(f"Expected one hidden anonymity block, found {enhancement_text.count(old_block)}")
          enhancement.write_text(enhancement_text.replace(old_block, new_block, 1))
          PY

          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -ne 2 ] || [ "${changed[0]}" != "src/app/App.tsx" ] || [ "${changed[1]}" != "src/historyContentEnhancements.ts" ]; then
            printf 'Unexpected changed files:\n%s\n' "${changed[*]}"
            exit 1
          fi
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx src/historyContentEnhancements.ts
          git commit -m "fix: restaurar envio anônimo de memórias"
          git push
