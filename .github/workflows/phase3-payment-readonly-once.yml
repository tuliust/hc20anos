name: Phase 3 payment readonly check once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase3-payment-readonly-once.yml"
      - "scripts/phase3-payment-readonly-check.mjs"

permissions:
  contents: read
  issues: write

jobs:
  inspect-payment-state:
    name: Inspect payment state without mutations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: phase3-test
    env:
      PHASE3_SUPABASE_URL: ${{ secrets.PHASE3_SUPABASE_URL }}
      PHASE3_SUPABASE_ANON_KEY: ${{ secrets.PHASE3_SUPABASE_ANON_KEY }}
      PHASE3_BUYER_EMAIL: ${{ secrets.PHASE3_BUYER_EMAIL }}
      PHASE3_BUYER_PASSWORD: ${{ secrets.PHASE3_BUYER_PASSWORD }}
      PHASE3_ADMIN_EMAIL: ${{ secrets.PHASE3_ADMIN_EMAIL }}
      PHASE3_ADMIN_PASSWORD: ${{ secrets.PHASE3_ADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read current financial state
        run: node scripts/phase3-payment-readonly-check.mjs
      - name: Upload sanitized report
        uses: actions/upload-artifact@v4
        with:
          name: phase3-payment-readonly-${{ github.run_id }}
          path: artifacts/phase3-payment-readonly-check.json
          retention-days: 14
      - name: Prepare Epic comment
        shell: bash
        run: |
          node <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const r = JSON.parse(await readFile("artifacts/phase3-payment-readonly-check.json", "utf8"));
          const lines = [
            "## Fase 3 — reconciliação somente leitura",
            "",
            `- Workflow run: ${process.env.GITHUB_RUN_ID}`,
            "- Mutação financeira executada: não",
            `- Ambiente financeiro: \`${r.payment_environment ?? "não informado"}\``,
            `- Status financeiro: \`${r.payment_status ?? "não encontrado"}\``,
            `- Detalhe: \`${r.payment_status_detail ?? "não informado"}\``,
            `- Reserva: \`${r.reservation_status ?? "não encontrada"}\``,
            `- Preferência: \`${r.preference_status ?? "não encontrada"}\``,
            `- Webhooks registrados: ${r.webhook_events}`,
            `- Falhas de webhook: ${r.webhook_failures}`,
            `- paid_at presente: ${r.paid_at_present}`,
            `- Participantes: ${r.participant_count}`,
            `- Ingressos emitidos: ${r.ticket_count}`,
            `- Status de ingressos: ${r.ticket_statuses.length ? r.ticket_statuses.map(x => `\`${x}\``).join(", ") : "nenhum"}`,
            "",
            "Nenhum secret, e-mail, URL de checkout, QR Code ou identificador financeiro completo foi publicado."
          ];
          await writeFile("artifacts/phase3-payment-readonly-comment.md", `${lines.join("\n")}\n`, "utf8");
          NODE
      - name: Update Epic 41
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 41 --repo "${GITHUB_REPOSITORY}" --body-file artifacts/phase3-payment-readonly-comment.md
