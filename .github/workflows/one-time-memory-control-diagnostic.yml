name: One-time fix diagnosed memory anonymity

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-memory-control-diagnostic.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch diagnosed anonymity regression
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          app = Path("src/app/App.tsx")
          text = app.read_text()
          old = '              <button onClick={() => setIsAnonymous(v => !v)} className={`relative w-12 h-6 transition-colors ${isAnonymous ? "bg-[#2d6a4f]" : "bg-[#1a2e1a] border border-[#2d6a4f]/30"}`}>'
          new = '''              <button
                type="button"
                role="switch"
                aria-checked={isAnonymous}
                aria-label="Enviar sem mostrar meu nome"
                onClick={() => setIsAnonymous(v => !v)}
                className={`relative w-12 h-6 transition-colors ${isAnonymous ? "bg-[#2d6a4f]" : "bg-[#1a2e1a] border border-[#2d6a4f]/30"}`}
              >'''
          if text.count(old) != 1:
              raise SystemExit(f"Expected one anonymity button anchor, found {text.count(old)}")
          text = text.replace(old, new, 1)
          old_knob = '                <div className={`absolute top-1 w-4 h-4 bg-[#f0ebe0] transition-all ${isAnonymous ? "left-7" : "left-1"}`} />'
          new_knob = '                <div aria-hidden="true" className={`absolute top-1 w-4 h-4 bg-[#f0ebe0] transition-all ${isAnonymous ? "left-7" : "left-1"}`} />'
          if text.count(old_knob) != 1:
              raise SystemExit(f"Expected one anonymity knob, found {text.count(old_knob)}")
          app.write_text(text.replace(old_knob, new_knob, 1))

          enhancement = Path("src/historyContentEnhancements.ts")
          text = enhancement.read_text()
          old_lines = '''    const toggle = anonymousControl.querySelector<HTMLButtonElement>("button");
    if (toggle?.className.includes("bg-[#2d6a4f]")) toggle.click();
    if (anonymousControl.style.display !== "none") anonymousControl.style.display = "none";'''
          new_lines = '''    anonymousControl.style.removeProperty("display");
    anonymousControl.removeAttribute("aria-hidden");'''
          if text.count(old_lines) != 1:
              raise SystemExit(f"Expected one anonymity hiding block, found {text.count(old_lines)}")
          enhancement.write_text(text.replace(old_lines, new_lines, 1))
          PY

          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 2

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx src/historyContentEnhancements.ts
          git commit -m "fix: restaurar envio anônimo de memórias"
          git push
