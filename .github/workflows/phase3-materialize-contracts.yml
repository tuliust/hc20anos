name: Phase 3 materialize contracts

on:
  push:
    branches:
      - agent/phase3-financial-execution
    paths:
      - .github/workflows/phase3-materialize-contracts.yml

permissions:
  contents: write

concurrency:
  group: phase3-materialize-contracts
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase3-financial-execution
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate static and RPC contracts
        run: |
          npm run docs:generate-contracts
          npm run docs:generate-routes
          npm run docs:generate-rpc-usage
          npm run rpc:check-any-casts
          npm run build

      - name: Start and replay local Supabase
        run: |
          set -o pipefail
          npx supabase start 2>&1 | tee phase3-materialize-start.log
          npx supabase db reset --local 2>&1 | tee phase3-materialize-reset.log

      - name: Install deterministic users and roles
        run: |
          docker exec -i supabase_db_hc20anos \
            psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -P pager=off \
            < supabase/tests/fixtures/local_test_context.sql

      - name: Run SQL integrity tests
        shell: bash
        run: |
          set -u
          failed=0
          while IFS= read -r test_file; do
            echo "===== ${test_file} ====="
            if ! output="$(docker exec -i supabase_db_hc20anos \
              psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres -P pager=off \
              < "${test_file}" 2>&1)"; then
              printf '%s\n' "${output}"
              failed=1
              continue
            fi
            printf '%s\n' "${output}"
            if grep -Eq '(^|[^A-Z])FAIL([^A-Z]|$)' <<< "${output}"; then failed=1; fi
          done < <(find supabase/tests -maxdepth 1 -type f -name '*.sql' | sort)
          exit "${failed}"

      - name: Generate database contracts and Phase 1 report
        run: |
          npm run docs:generate-db-contracts
          source_paths=(supabase/migrations supabase/tests src/lib/rpc.types.ts scripts/generate-consumed-rpc-contracts.mjs scripts/migrate-rpc-any-casts.mjs .github/workflows/phase1-environment-security.yml)
          verified_commit="$(git log --no-merges -1 --format=%H -- "${source_paths[@]}")"
          verified_date="$(git log --no-merges -1 --format=%cs -- "${source_paths[@]}")"
          cat > docs/30-contratos/fase-1-ambiente-e-seguranca.generated.md <<EOF
          ---
          status: generated
          owner: tuliust
          last_verified: ${verified_date}
          last_verified_commit: ${verified_commit}
          generation_command: GitHub Actions / Phase 1 environment and security
          source_files:
            - supabase/migrations/
            - supabase/tests/
            - src/lib/rpc.types.ts
            - scripts/generate-consumed-rpc-contracts.mjs
            - scripts/migrate-rpc-any-casts.mjs
            - .github/workflows/phase1-environment-security.yml
          ---

          # Fase 1 — ambiente e segurança

          | Verificação | Resultado |
          |---|---|
          | Inventário e contratos das RPCs consumidas | `success` |
          | Zero casts `(supabase as any).rpc` | `success` |
          | Build TypeScript e aplicação | `success` |
          | Inicialização do Supabase local | `success` |
          | Replay integral das migrations | `success` |
          | Usuários e roles determinísticos | `success` |
          | RLS, grants, triggers, constraints e roles | `success` |
          | Regeneração dos contratos do banco | `success` |
          | Auditoria documental | `success` |

          O ambiente usa somente Supabase local e dados sintéticos. Nenhum banco remoto ou dado de produção é consultado. Os logs SQL completos permanecem nos artefatos do workflow.
          EOF
          npm run audit:docs

      - name: Commit generated contracts
        shell: bash
        run: |
          files=(
            docs/30-contratos/APIs.generated.md
            docs/30-contratos/edge-functions.generated.md
            docs/30-contratos/variaveis-de-ambiente.generated.md
            docs/30-contratos/codigos-de-erro.generated.md
            docs/30-contratos/rotas.generated.md
            docs/30-contratos/banco.generated.md
            docs/30-contratos/RPCs.generated.md
            docs/30-contratos/RLS.generated.md
            docs/30-contratos/erd.generated.mmd
            docs/30-contratos/database.types.generated.ts
            docs/30-contratos/RPCs-consumidas.generated.md
            docs/30-contratos/fase-1-ambiente-e-seguranca.generated.md
            src/lib/rpc.generated.ts
          )
          changes="$(git status --porcelain --untracked-files=all -- "${files[@]}")"
          if [ -z "${changes}" ]; then
            echo "Nenhum contrato precisou ser atualizado."
            exit 0
          fi
          echo "${changes}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "docs: materializar contratos da fase 3"
          git push origin HEAD:agent/phase3-financial-execution

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup || true
