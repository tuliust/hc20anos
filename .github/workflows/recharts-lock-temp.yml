name: Generate Recharts lock
on:
  push:
    branches:
      - refactor/frontend-architecture-20261003

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Generate package files
        run: npm install --package-lock-only --ignore-scripts --save-exact recharts@3.10.1 react-is@18.3.1
      - uses: actions/upload-artifact@v4
        with:
          name: recharts-package-files
          path: |
            package.json
            package-lock.json
          retention-days: 1
