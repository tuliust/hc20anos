name: One-time FAQ type imports

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-faq-type-imports.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace exact FAQ type imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("src/app/admin/faq/AdminFaqPanel.tsx"): (
                  'import type { AdminRole, DbAdminUser, DbFaqCategory, DbFaqItem } from "../../../lib/database.types";',
                  'import type { AdminRole, DbAdminUser } from "../../../lib/database.types";\n'
                  'import type { DbFaqCategory, DbFaqItem } from "../../../lib/faq.types";',
              ),
              Path("src/lib/faq.ts"): (
                  'import type { DbFaqCategory, DbFaqItem } from "./database.types";',
                  'import type { DbFaqCategory, DbFaqItem } from "./faq.types";',
              ),
          }

          for path, (old, new) in replacements.items():
              content = path.read_text(encoding="utf-8")
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: esperado exatamente 1 import antigo; encontrado {count}")
              path.write_text(content.replace(old, new), encoding="utf-8")
          PY

          git diff --check
          git diff -- src/app/admin/faq/AdminFaqPanel.tsx src/lib/faq.ts

      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet -- src/app/admin/faq/AdminFaqPanel.tsx src/lib/faq.ts; then
            echo "Nenhuma alteração encontrada."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/admin/faq/AdminFaqPanel.tsx src/lib/faq.ts
          git commit -m "refactor: concluir migração dos tipos de FAQ"

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push concorrente detectado; rebase antes da tentativa ${attempt}."
            git pull --rebase origin main
          done

          echo "Não foi possível publicar a migração após três tentativas."
          exit 1
