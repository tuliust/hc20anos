name: Validate home UI polish once

on:
  push:
    branches:
      - fix/home-ui-profile-poll-confirmed-hover
    paths:
      - .github/workflows/validate-home-ui-polish-once.yml

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-ui-profile-poll-confirmed-hover
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build application
        run: npm run build
      - name: Run focused home UI regression
        run: npx playwright test tests/e2e/home-ui-polish.spec.ts
